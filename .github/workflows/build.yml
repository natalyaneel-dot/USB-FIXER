name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare and Fix Files
        run: |
          unzip -o UsbFixer_Android_App_Project.zip
          perl -0777 -pi -e 's/\nاضغط/\\nاضغط/g' app/src/main/java/com/example/usbfixer/MainActivity.kt
          perl -0777 -pi -e 's/\nDownloads/\\nDownloads/g' app/src/main/java/com/example/usbfixer/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: UsbFixer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
