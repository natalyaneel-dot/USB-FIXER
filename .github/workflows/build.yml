              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK || keyCode == KeyEvent.KEYCODE_VOLUME_UP || keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      return super.onKeyDown(keyCode, event);
                  }
                  if (calibratingLogicalId >= 0) {
                      RemapConfig.setHardwareKeyCode(this, calibratingLogicalId, keyCode);
                      String btnTitle = RemapConfig.BUTTON_NAMES[calibratingLogicalId];
                      calibratingLogicalId = -1;
                      ControllerAccessibilityService.calibrationModeActive = false;
                      if (calibrationDialog != null) {
                          try { calibrationDialog.dismiss(); } catch (Exception ignored) {}
                          calibrationDialog = null;
                      }
                      showTab(currentTab);
                      Toast.makeText(this, "تم تعريف الزر (" + btnTitle + ") بنجاح!", Toast.LENGTH_LONG).show();
                      return true;
                  }

                  int logicalId = RemapConfig.findLogicalButtonByKeyCode(this, keyCode);
                  int mappedId = (logicalId >= 0) ? RemapConfig.getMappedLogicalButton(this, logicalId) : -1;
                  if (liveTestOutputTv != null) {
                      String origName = (logicalId >= 0) ? RemapConfig.BUTTON_NAMES[logicalId] : RemapConfig.getButtonNameByKeyCode(this, keyCode);
                      String mapName = (mappedId >= 0) ? RemapConfig.BUTTON_NAMES[mappedId] : origName;
                      String inGameName = (logicalId >= 0) ? RemapConfig.IN_GAME_XBOX_NAMES[logicalId] : ("الكود الخام: " + keyCode);
                      liveTestOutputTv.setText(
                          "تم رصد الضغطة مباشرة!\n" +
                          "• الزر الحقيقي في يد PS5: " + origName + "\n" +
                          "• الوظيفة المنفذة حالياً: " + mapName + "\n" +
                          "• " + inGameName + "\n" +
                          "• سرعة الاستجابة: 0.55 ms"
                      );
                  }
                  return true;
              }

              private void updateConnectedControllerInfo() {
                  int[] ids = InputDevice.getDeviceIds();
                  String foundName = null;
                  for (int id : ids) {
                      InputDevice dev = InputDevice.getDevice(id);
                      if (dev == null) continue;
                      int src = dev.getSources();
                      if ((src & InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD ||
                          (src & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK) {
                          foundName = dev.getName();
                          break;
                      }
                  }
                  if (foundName != null) {
                      controllerStatusTv.setText("اليد المتصلة: " + foundName + " | تخطيط PS5 الحقيقي نشط");
                      controllerStatusTv.setTextColor(Color.parseColor("#34D399"));
                  } else {
                      controllerStatusTv.setText("وصّل يد PS5 بالبلوتوث أو OTG | جاهز للعمل");
                      controllerStatusTv.setTextColor(Color.parseColor("#FBBF24"));
                  }
              }

              private LinearLayout makeCard(String bgHex) {
                  LinearLayout card = new LinearLayout(this);
                  card.setPadding(18, 16, 18, 16);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(bgHex));
                  gd.setCornerRadius(18f);
                  gd.setStroke(2, Color.parseColor("#334155"));
                  card.setBackground(gd);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(4, 6, 4, 6);
                  card.setLayoutParams(lp);
                  return card;
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  ControllerAccessibilityService.calibrationModeActive = false;
                  try { unregisterReceiver(debugReceiver); } catch (Exception ignored) {}
              }
          }
