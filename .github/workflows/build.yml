name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate DualSense PS5 Pro v2 and Build APK
        run: |
          rm -rf app build.gradle* settings.gradle* gradle.properties
          mkdir -p app/src/main/java/com/example/dualsensepro app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DualSensePro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.dualsensepro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.dualsensepro"
                  minSdk 24
                  targetSdk 33
                  versionCode 2
                  versionName "2.0-PS5-Fixed"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="5" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="DualSense Pro v2"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ControllerAccessibilityService"
                      android:label="محرك أزرار الكنترول والمايكرو الاحترافي"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/dualsensepro/RemapConfig.java
          package com.example.dualsensepro;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.view.KeyEvent;

          public class RemapConfig {
              private static final String PREFS = "dualsense_pro_v2_prefs";

              public static final int BTN_CROSS = 0;
              public static final int BTN_CIRCLE = 1;
              public static final int BTN_SQUARE = 2;
              public static final int BTN_TRIANGLE = 3;
              public static final int BTN_L1 = 4;
              public static final int BTN_R1 = 5;
              public static final int BTN_L2 = 6;
              public static final int BTN_R2 = 7;
              public static final int BTN_L3 = 8;
              public static final int BTN_R3 = 9;
              public static final int BTN_UP = 10;
              public static final int BTN_DOWN = 11;
              public static final int BTN_LEFT = 12;
              public static final int BTN_RIGHT = 13;

              public static final int BUTTON_COUNT = 14;

              public static final int[] DEFAULT_PS5_RAW_CODES = {
                  KeyEvent.KEYCODE_BUTTON_B,      // 0: ✕ Cross (97)
                  KeyEvent.KEYCODE_BUTTON_C,      // 1: ◯ Circle (98)
                  KeyEvent.KEYCODE_BUTTON_A,      // 2: □ Square (96)
                  KeyEvent.KEYCODE_BUTTON_X,      // 3: △ Triangle (99)
                  KeyEvent.KEYCODE_BUTTON_Y,      // 4: L1 (100)
                  KeyEvent.KEYCODE_BUTTON_Z,      // 5: R1 (101)
                  KeyEvent.KEYCODE_BUTTON_L1,     // 6: L2 (102)
                  KeyEvent.KEYCODE_BUTTON_R1,     // 7: R2 (103)
                  KeyEvent.KEYCODE_BUTTON_SELECT, // 8: L3 (109)
                  KeyEvent.KEYCODE_BUTTON_START,  // 9: R3 (108)
                  KeyEvent.KEYCODE_DPAD_UP,       // 10: Up
                  KeyEvent.KEYCODE_DPAD_DOWN,     // 11: Down
                  KeyEvent.KEYCODE_DPAD_LEFT,     // 12: Left
                  KeyEvent.KEYCODE_DPAD_RIGHT     // 13: Right
              };

              public static final String[] BUTTON_NAMES = {
                  "✕ (إكس - Cross)",
                  "◯ (دائرة - Circle)",
                  "□ (مربع - Square)",
                  "△ (مثلث - Triangle)",
                  "L1 (الكتف الأيسر)",
                  "R1 (الكتف الأيمن)",
                  "L2 (الزناد الأيسر)",
                  "R2 (الزناد الأيمن)",
                  "L3 (ضغطة العصا اليسرى)",
                  "R3 (ضغطة العصا اليمنى)",
                  "سهم لأعلى",
                  "سهم لأسفل",
                  "سهم لليسار",
                  "سهم لليمين"
              };

              public static final String[] IN_GAME_XBOX_NAMES = {
                  "اسمه داخل إعدادات الألعاب: Button B",
                  "اسمه داخل إعدادات الألعاب: Button C",
                  "اسمه داخل إعدادات الألعاب: Button A",
                  "اسمه داخل إعدادات الألعاب: Button X",
                  "اسمه داخل إعدادات الألعاب: Button Y",
                  "اسمه داخل إعدادات الألعاب: Button Z",
                  "اسمه داخل إعدادات الألعاب: Button L1",
                  "اسمه داخل إعدادات الألعاب: Button R1",
                  "اسمه داخل إعدادات الألعاب: Select / L3",
                  "اسمه داخل إعدادات الألعاب: Start / R3",
                  "اسمه داخل إعدادات الألعاب: D-Pad Up",
                  "اسمه داخل إعدادات الألعاب: D-Pad Down",
                  "اسمه داخل إعدادات الألعاب: D-Pad Left",
                  "اسمه داخل إعدادات الألعاب: D-Pad Right"
              };

              public static final String[] SHORT_LABELS = {
                  "✕", "◯", "□", "△", "L1", "R1", "L2", "R2", "L3", "R3", "↑", "↓", "←", "→"
              };

              private static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static int getHardwareKeyCode(Context c, int logicalBtnId) {
                  if (logicalBtnId < 0 || logicalBtnId >= BUTTON_COUNT) return 0;
                  return prefs(c).getInt("hw_code_" + logicalBtnId, DEFAULT_PS5_RAW_CODES[logicalBtnId]);
              }

              public static void setHardwareKeyCode(Context c, int logicalBtnId, int keyCode) {
                  prefs(c).edit().putInt("hw_code_" + logicalBtnId, keyCode).apply();
              }

              public static void resetHardwareKeyCodesToPs5Raw(Context c) {
                  SharedPreferences.Editor ed = prefs(c).edit();
                  for (int i = 0; i < BUTTON_COUNT; i++) {
                      ed.putInt("hw_code_" + i, DEFAULT_PS5_RAW_CODES[i]);
                  }
                  ed.apply();
              }

              public static int findLogicalButtonByKeyCode(Context c, int keyCode) {
                  for (int i = 0; i < BUTTON_COUNT; i++) {
                      if (getHardwareKeyCode(c, i) == keyCode) return i;
                  }
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_THUMBL) return BTN_L3;
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_THUMBR) return BTN_R3;
                  return -1;
              }

              public static String getButtonNameByKeyCode(Context c, int keyCode) {
                  int id = findLogicalButtonByKeyCode(c, keyCode);
                  if (id >= 0) return BUTTON_NAMES[id];
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_L2) return "زر Share (مشاركة)";
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_R2) return "زر Options (خيارات)";
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_MODE) return "زر PS (البلايستيشن)";
                  return "زر إضافي (كود " + keyCode + ")";
              }

              public static String getActiveProfile(Context c) {
                  return prefs(c).getString("active_profile", "Rocket League Sideswipe");
              }

              public static void setActiveProfile(Context c, String profile) {
                  prefs(c).edit().putString("active_profile", profile).apply();
              }

              public static int getMappedLogicalButton(Context c, int origLogicalId) {
                  String prof = getActiveProfile(c);
                  return prefs(c).getInt(prof + "_remap_id_" + origLogicalId, origLogicalId);
              }

              public static void setMappedLogicalButton(Context c, int origLogicalId, int targetLogicalId) {
                  String prof = getActiveProfile(c);
                  prefs(c).edit().putInt(prof + "_remap_id_" + origLogicalId, targetLogicalId).apply();
              }

              public static void resetAllMappings(Context c) {
                  String prof = getActiveProfile(c);
                  SharedPreferences.Editor ed = prefs(c).edit();
                  for (int i = 0; i < BUTTON_COUNT; i++) {
                      ed.putInt(prof + "_remap_id_" + i, i);
                      ed.putBoolean(prof + "_turbo_id_" + i, false);
                  }
                  ed.apply();
              }

              public static boolean isHoldModeEnabled(Context c) {
                  return prefs(c).getBoolean("continuous_hold_mode", true);
              }

              public static void setHoldModeEnabled(Context c, boolean en) {
                  prefs(c).edit().putBoolean("continuous_hold_mode", en).apply();
              }

              public static int getHudButtonsCount(Context c) {
                  return prefs(c).getInt("hud_btn_count", 6);
              }

              public static void setHudButtonsCount(Context c, int count) {
                  prefs(c).edit().putInt("hud_btn_count", count).apply();
              }

              public static boolean isTurboEnabled(Context c, int logicalId) {
                  String prof = getActiveProfile(c);
                  return prefs(c).getBoolean(prof + "_turbo_id_" + logicalId, false);
              }

              public static void setTurboEnabled(Context c, int logicalId, boolean enabled) {
                  String prof = getActiveProfile(c);
                  prefs(c).edit().putBoolean(prof + "_turbo_id_" + logicalId, enabled).apply();
              }

              public static int getTurboIntervalMs(Context c) {
                  return prefs(c).getInt("turbo_interval_ms", 50);
              }

              public static void setTurboIntervalMs(Context c, int ms) {
                  prefs(c).edit().putInt("turbo_interval_ms", Math.max(20, ms)).apply();
              }

              public static float getButtonX(Context c, int logicalId, int screenW, int screenH) {
                  int maxDim = Math.max(screenW, screenH);
                  float defX;
                  if (logicalId == BTN_CROSS) defX = maxDim * 0.77f;
                  else if (logicalId == BTN_CIRCLE) defX = maxDim * 0.87f;
                  else if (logicalId == BTN_SQUARE) defX = maxDim * 0.67f;
                  else if (logicalId == BTN_TRIANGLE) defX = maxDim * 0.77f;
                  else defX = 180f + (logicalId % 5) * 130f;
                  return prefs(c).getFloat("pos_x_id_" + logicalId, defX);
              }

              public static float getButtonY(Context c, int logicalId, int screenW, int screenH) {
                  int minDim = Math.min(screenW, screenH);
                  float defY;
                  if (logicalId == BTN_CROSS) defY = minDim * 0.70f;
                  else if (logicalId == BTN_CIRCLE) defY = minDim * 0.50f;
                  else if (logicalId == BTN_SQUARE) defY = minDim * 0.70f;
                  else if (logicalId == BTN_TRIANGLE) defY = minDim * 0.42f;
                  else defY = 180f + (logicalId / 5) * 130f;
                  return prefs(c).getFloat("pos_y_id_" + logicalId, defY);
              }

              public static void saveButtonPos(Context c, int logicalId, float x, float y) {
                  prefs(c).edit().putFloat("pos_x_id_" + logicalId, x).putFloat("pos_y_id_" + logicalId, y).apply();
              }

              public static void applySideswipePresetPositions(Context c, int screenW, int screenH) {
                  int w = Math.max(screenW, screenH);
                  int h = Math.min(screenW, screenH);
                  SharedPreferences.Editor ed = prefs(c).edit();
                  ed.putFloat("pos_x_id_" + BTN_CROSS, w * 0.77f).putFloat("pos_y_id_" + BTN_CROSS, h * 0.70f);
                  ed.putFloat("pos_x_id_" + BTN_CIRCLE, w * 0.87f).putFloat("pos_y_id_" + BTN_CIRCLE, h * 0.50f);
                  ed.putFloat("pos_x_id_" + BTN_SQUARE, w * 0.67f).putFloat("pos_y_id_" + BTN_SQUARE, h * 0.70f);
                  ed.putFloat("pos_x_id_" + BTN_TRIANGLE, w * 0.77f).putFloat("pos_y_id_" + BTN_TRIANGLE, h * 0.42f);
                  ed.putFloat("pos_x_id_" + BTN_L1, w * 0.15f).putFloat("pos_y_id_" + BTN_L1, h * 0.25f);
                  ed.putFloat("pos_x_id_" + BTN_R1, w * 0.85f).putFloat("pos_y_id_" + BTN_R1, h * 0.25f);
                  ed.apply();
              }

              public static boolean isMacroEnabled(Context c, int slot) {
                  return prefs(c).getBoolean("macro_en_" + slot, false);
              }

              public static void setMacroEnabled(Context c, int slot, boolean en) {
                  prefs(c).edit().putBoolean("macro_en_" + slot, en).apply();
              }

              public static int getMacroTrigger1(Context c, int slot) {
                  int def = (slot == 1) ? BTN_L1 : (slot == 2 ? BTN_R1 : BTN_L3);
                  return prefs(c).getInt("macro_trig1_id_" + slot, def);
              }

              public static int getMacroTrigger2(Context c, int slot) {
                  return prefs(c).getInt("macro_trig2_id_" + slot, -1);
              }

              public static int getMacroStep(Context c, int slot, int stepIndex) {
                  int[] defs = {BTN_CROSS, BTN_CIRCLE, -1};
                  return prefs(c).getInt("macro_step_id_" + slot + "_" + stepIndex, defs[stepIndex % 3]);
              }

              public static int getMacroDelayMs(Context c, int slot) {
                  return prefs(c).getInt("macro_delay_" + slot, 0);
              }

              public static void saveMacro(Context c, int slot, int trig1, int trig2, int s1, int s2, int s3, int delayMs) {
                  prefs(c).edit()
                      .putBoolean("macro_en_" + slot, true)
                      .putInt("macro_trig1_id_" + slot, trig1)
                      .putInt("macro_trig2_id_" + slot, trig2)
                      .putInt("macro_step_id_" + slot + "_0", s1)
                      .putInt("macro_step_id_" + slot + "_1", s2)
                      .putInt("macro_step_id_" + slot + "_2", s3)
                      .putInt("macro_delay_" + slot, delayMs)
                      .apply();
              }

              public static boolean isZeroLagBoostEnabled(Context c) {
                  return prefs(c).getBoolean("zero_lag_boost", true);
              }

              public static void setZeroLagBoostEnabled(Context c, boolean en) {
                  prefs(c).edit().putBoolean("zero_lag_boost", en).apply();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/dualsensepro/ControllerAccessibilityService.java
          package com.example.dualsensepro;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Process;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.*;

          public class ControllerAccessibilityService extends AccessibilityService {

              public static ControllerAccessibilityService instance;
              public static final String ACTION_KEY_DEBUG = "com.example.dualsensepro.KEY_DEBUG";
              public static volatile boolean calibrationModeActive = false;

              private WindowManager wm;
              private View controlBarView;
              private final Map<Integer, View> targetViews = new HashMap<>();
              private final Map<Integer, WindowManager.LayoutParams> targetParams = new HashMap<>();
              private boolean overlayShowing = false;
              private boolean targetsLocked = false;

              private final Set<Integer> pressedLogicalButtons = new HashSet<>();
              private final Set<Integer> activeTouchHoldTargets = new LinkedHashSet<>();
              private final long[] lastPressTimeMs = new long[RemapConfig.BUTTON_COUNT];

              private final Map<Integer, Runnable> turboRunnables = new HashMap<>();
              private final Handler handler = new Handler(Looper.getMainLooper());
              private long lastEventNano = 0;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  if (RemapConfig.isZeroLagBoostEnabled(this)) {
                      try {
                          Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_DISPLAY);
                      } catch (Exception ignored) {}
                  }
                  Toast.makeText(this, "تم تفعيل محرك أزرار PS5 بنجاح (الأسماء الحقيقية مضبوطة 100%)", Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  int keyCode = event.getKeyCode();
                  int action = event.getAction();

                  if (keyCode == KeyEvent.KEYCODE_VOLUME_UP || keyCode == KeyEvent.KEYCODE_VOLUME_DOWN ||
                      keyCode == KeyEvent.KEYCODE_POWER || keyCode == KeyEvent.KEYCODE_BACK ||
                      keyCode == KeyEvent.KEYCODE_HOME || keyCode == KeyEvent.KEYCODE_APP_SWITCH) {
                      return false;
                  }

                  if (RemapConfig.isZeroLagBoostEnabled(this)) {
                      try {
                          Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_DISPLAY);
                      } catch (Exception ignored) {}
                  }

                  long nowNano = System.nanoTime();
                  long deltaUs = (lastEventNano > 0) ? (nowNano - lastEventNano) / 1000 : 650;
                  lastEventNano = nowNano;

                  int logicalId = RemapConfig.findLogicalButtonByKeyCode(this, keyCode);
                  int mappedLogicalId = (logicalId >= 0) ? RemapConfig.getMappedLogicalButton(this, logicalId) : -1;

                  Intent dbg = new Intent(ACTION_KEY_DEBUG);
                  dbg.setPackage(getPackageName());
                  dbg.putExtra("rawKeyCode", keyCode);
                  dbg.putExtra("logicalId", logicalId);
                  dbg.putExtra("mappedLogicalId", mappedLogicalId);
                  dbg.putExtra("action", action);
                  dbg.putExtra("latencyUs", deltaUs);
                  sendBroadcast(dbg);

                  if (calibrationModeActive) {
                      return true;
                  }

                  if (!overlayShowing || !targetsLocked) {
                      if (action == KeyEvent.ACTION_UP) {
                          pressedLogicalButtons.clear();
                          activeTouchHoldTargets.clear();
                      }
                      return false;
                  }

                  if (logicalId >= RemapConfig.BTN_UP && logicalId <= RemapConfig.BTN_RIGHT) {
                      if (!targetParams.containsKey(mappedLogicalId)) {
                          return false;
                      }
                  }

                  if (logicalId < 0) {
                      return false;
                  }

                  if (action == KeyEvent.ACTION_DOWN) {
                      if (event.getRepeatCount() > 0) return true;

                      long nowMs = System.currentTimeMillis();
                      if (nowMs - lastPressTimeMs[logicalId] < 18) {
                          return true;
                      }
                      lastPressTimeMs[logicalId] = nowMs;

                      boolean isNewPress = pressedLogicalButtons.add(logicalId);
                      if (!isNewPress) return true;

                      for (int slot = 1; slot <= 3; slot++) {
                          if (!RemapConfig.isMacroEnabled(this, slot)) continue;
                          int t1 = RemapConfig.getMacroTrigger1(this, slot);
                          int t2 = RemapConfig.getMacroTrigger2(this, slot);
                          if (t2 >= 0) {
                              if ((logicalId == t1 && pressedLogicalButtons.contains(t2)) ||
                                  (logicalId == t2 && pressedLogicalButtons.contains(t1))) {
                                  executeMacro(slot);
                                  return true;
                              }
                          } else if (logicalId == t1) {
                              executeMacro(slot);
                              return true;
                          }
                      }

                      if (RemapConfig.isTurboEnabled(this, logicalId)) {
                          triggerQuickTap(mappedLogicalId, 40);
                          startTurboLoop(logicalId, mappedLogicalId);
                      } else if (RemapConfig.isHoldModeEnabled(this)) {
                          activeTouchHoldTargets.add(mappedLogicalId);
                          updateMultiTouchHoldGesture();
                      } else {
                          triggerQuickTap(mappedLogicalId, 55);
                      }
                      return true;

                  } else if (action == KeyEvent.ACTION_UP) {
                      pressedLogicalButtons.remove(logicalId);
                      stopTurboLoop(logicalId);

                      for (int slot = 1; slot <= 3; slot++) {
                          if (RemapConfig.isMacroEnabled(this, slot) && RemapConfig.getMacroTrigger1(this, slot) == logicalId) {
                              int s1 = RemapConfig.getMacroStep(this, slot, 0);
                              int s2 = RemapConfig.getMacroStep(this, slot, 1);
                              int s3 = RemapConfig.getMacroStep(this, slot, 2);
                              if (s1 >= 0) activeTouchHoldTargets.remove(s1);
                              if (s2 >= 0) activeTouchHoldTargets.remove(s2);
                              if (s3 >= 0) activeTouchHoldTargets.remove(s3);
                          }
                      }

                      if (activeTouchHoldTargets.remove(mappedLogicalId) || RemapConfig.isHoldModeEnabled(this)) {
                          updateMultiTouchHoldGesture();
                      }
                      return true;
                  }

                  return false;
              }

              private void updateMultiTouchHoldGesture() {
                  if (Build.VERSION.SDK_INT < 24) return;

                  if (activeTouchHoldTargets.isEmpty()) {
                      Path releasePath = new Path();
                      releasePath.moveTo(2f, 2f);
                      GestureDescription.Builder b = new GestureDescription.Builder();
                      b.addStroke(new GestureDescription.StrokeDescription(releasePath, 0, 1));
                      dispatchGesture(b.build(), null, null);
                      return;
                  }

                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  int idx = 0;
                  for (int targetLogicalId : activeTouchHoldTargets) {
                      float[] xy = getTargetCenter(targetLogicalId);
                      Path p = new Path();
                      p.moveTo(xy[0] + idx * 1.5f, xy[1]);
                      p.lineTo(xy[0] + idx * 1.5f + 1f, xy[1] + 1f);
                      builder.addStroke(new GestureDescription.StrokeDescription(p, 0, 12000));
                      idx++;
                  }
                  if (idx > 0) {
                      dispatchGesture(builder.build(), null, null);
                  }
              }

              private void startTurboLoop(final int origLogicalId, final int mappedLogicalId) {
                  stopTurboLoop(origLogicalId);
                  final int interval = RemapConfig.getTurboIntervalMs(this);
                  Runnable r = new Runnable() {
                      @Override
                      public void run() {
                          if (pressedLogicalButtons.contains(origLogicalId) && overlayShowing && targetsLocked) {
                              triggerQuickTap(mappedLogicalId, Math.max(15, interval - 12));
                              handler.postDelayed(this, interval);
                          }
                      }
                  };
                  turboRunnables.put(origLogicalId, r);
                  handler.postDelayed(r, interval);
              }

              private void stopTurboLoop(int origLogicalId) {
                  Runnable r = turboRunnables.remove(origLogicalId);
                  if (r != null) handler.removeCallbacks(r);
              }

              private void executeMacro(int slot) {
                  final int s1 = RemapConfig.getMacroStep(this, slot, 0);
                  final int s2 = RemapConfig.getMacroStep(this, slot, 1);
                  final int s3 = RemapConfig.getMacroStep(this, slot, 2);
                  final int delay = RemapConfig.getMacroDelayMs(this, slot);

                  if (delay <= 5) {
                      if (RemapConfig.isHoldModeEnabled(this)) {
                          if (s1 >= 0) activeTouchHoldTargets.add(s1);
                          if (s2 >= 0) activeTouchHoldTargets.add(s2);
                          if (s3 >= 0) activeTouchHoldTargets.add(s3);
                          updateMultiTouchHoldGesture();
                      } else if (Build.VERSION.SDK_INT >= 24) {
                          GestureDescription.Builder gb = new GestureDescription.Builder();
                          int[] steps = {s1, s2, s3};
                          int added = 0;
                          for (int k : steps) {
                              if (k < 0) continue;
                              float[] xy = getTargetCenter(k);
                              Path p = new Path();
                              p.moveTo(xy[0] + added * 2f, xy[1]);
                              gb.addStroke(new GestureDescription.StrokeDescription(p, 0, 75));
                              added++;
                          }
                          if (added > 0) dispatchGesture(gb.build(), null, null);
                      }
                  } else {
                      if (s1 >= 0) triggerQuickTap(s1, 55);
                      if (s2 >= 0) handler.postDelayed(() -> triggerQuickTap(s2, 55), delay);
                      if (s3 >= 0) handler.postDelayed(() -> triggerQuickTap(s3, 55), delay * 2L);
                  }
              }

              public void triggerQuickTap(int targetLogicalId, int durationMs) {
                  if (Build.VERSION.SDK_INT < 24 || targetLogicalId < 0) return;
                  float[] xy = getTargetCenter(targetLogicalId);
                  Path path = new Path();
                  path.moveTo(xy[0], xy[1]);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(new GestureDescription.StrokeDescription(path, 0, durationMs));
                  dispatchGesture(builder.build(), null, null);
              }

              private float[] getTargetCenter(int logicalId) {
                  WindowManager.LayoutParams lp = targetParams.get(logicalId);
                  if (lp != null) {
                      return new float[]{lp.x + 52f, lp.y + 52f};
                  }
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  return new float[]{
                      RemapConfig.getButtonX(this, logicalId, dm.widthPixels, dm.heightPixels) + 52f,
                      RemapConfig.getButtonY(this, logicalId, dm.widthPixels, dm.heightPixels) + 52f
                  };
              }

              public void toggleOverlayHud() {
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "يرجى منح صلاحية الظهور فوق التطبيقات أولاً!", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (overlayShowing) removeOverlayHud();
                  else showOverlayHud();
              }

              public void refreshOverlayPositions() {
                  if (overlayShowing) {
                      removeOverlayHud();
                      showOverlayHud();
                  }
              }

              private void showOverlayHud() {
                  if (overlayShowing) return;
                  overlayShowing = true;
                  targetsLocked = false;

                  int overlayType = (Build.VERSION.SDK_INT >= 26)
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  DisplayMetrics dm = getResources().getDisplayMetrics();

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(16, 8, 16, 8);
                  GradientDrawable barBg = new GradientDrawable();
                  barBg.setColor(Color.argb(230, 15, 23, 42));
                  barBg.setCornerRadius(30f);
                  barBg.setStroke(2, Color.parseColor("#38BDF8"));
                  bar.setBackground(barBg);

                  TextView title = new TextView(this);
                  title.setText("PS5 HUD  ");
                  title.setTextColor(Color.parseColor("#38BDF8"));
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setTextSize(12f);

                  final Button lockBtn = new Button(this);
                  lockBtn.setText("حرّك الدوائر ثم اضغط هنا للقفل واللعب");
                  lockBtn.setTextSize(11f);
                  lockBtn.setAllCaps(false);
                  lockBtn.setTextColor(Color.WHITE);
                  lockBtn.setBackgroundColor(Color.parseColor("#059669"));
                  lockBtn.setPadding(16, 6, 16, 6);

                  Button closeBtn = new Button(this);
                  closeBtn.setText("إغلاق");
                  closeBtn.setTextSize(11f);
                  closeBtn.setAllCaps(false);
                  closeBtn.setTextColor(Color.WHITE);
                  closeBtn.setBackgroundColor(Color.parseColor("#DC2626"));
                  closeBtn.setPadding(14, 6, 14, 6);

                  bar.addView(title);
                  bar.addView(lockBtn);
                  bar.addView(closeBtn);

                  final WindowManager.LayoutParams barLp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );
                  barLp.gravity = Gravity.TOP | Gravity.START;
                  barLp.x = 50;
                  barLp.y = 30;

                  title.setOnTouchListener(new View.OnTouchListener() {
                      float dx, dy;
                      @Override public boolean onTouch(View v, MotionEvent ev) {
                          if (ev.getAction() == MotionEvent.ACTION_DOWN) {
                              dx = barLp.x - ev.getRawX();
                              dy = barLp.y - ev.getRawY();
                          } else if (ev.getAction() == MotionEvent.ACTION_MOVE) {
                              barLp.x = (int) (ev.getRawX() + dx);
                              barLp.y = (int) (ev.getRawY() + dy);
                              wm.updateViewLayout(bar, barLp);
                          }
                          return true;
                      }
                  });

                  lockBtn.setOnClickListener(v -> {
                      targetsLocked = !targetsLocked;
                      pressedLogicalButtons.clear();
                      activeTouchHoldTargets.clear();
                      if (targetsLocked) {
                          lockBtn.setText("مقفل للعب (الأزرار نشطة الآن)");
                          lockBtn.setBackgroundColor(Color.parseColor("#2563EB"));
                          Toast.makeText(ControllerAccessibilityService.this, "تم تفعيل الأزرار! يمكنك اللعب الآن", Toast.LENGTH_SHORT).show();
                      } else {
                          lockBtn.setText("حرّك الدوائر ثم اضغط هنا للقفل واللعب");
                          lockBtn.setBackgroundColor(Color.parseColor("#059669"));
                      }
                      updateTargetsLockState();
                  });

                  closeBtn.setOnClickListener(v -> removeOverlayHud());

                  wm.addView(bar, barLp);
                  controlBarView = bar;

                  int count = Math.min(RemapConfig.getHudButtonsCount(this), RemapConfig.BUTTON_COUNT);
                  String[] subHints = {"قفز ✕", "تيربو ◯", "شقلبة □", "مثلث △", "L1", "R1", "L2", "R2", "L3", "R3", "↑", "↓", "←", "→"};
                  String[] circleColors = {"#2563EB", "#DC2626", "#9333EA", "#059669", "#0284C7", "#0284C7", "#4F46E5", "#4F46E5", "#334155", "#334155", "#334155", "#334155", "#334155", "#334155"};

                  for (int i = 0; i < count; i++) {
                      final int logicalId = i;
                      TextView tv = new TextView(this);
                      tv.setText(subHints[i]);
                      tv.setTextColor(Color.WHITE);
                      tv.setTextSize(12f);
                      tv.setTypeface(Typeface.DEFAULT_BOLD);
                      tv.setGravity(Gravity.CENTER);

                      GradientDrawable circle = new GradientDrawable();
                      circle.setShape(GradientDrawable.OVAL);
                      int baseColor = Color.parseColor(circleColors[i]);
                      circle.setColor(Color.argb(175, Color.red(baseColor), Color.green(baseColor), Color.blue(baseColor)));
                      circle.setStroke(3, Color.WHITE);
                      tv.setBackground(circle);

                      final WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              104, 104,
                              overlayType,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                              PixelFormat.TRANSLUCENT
                      );
                      lp.gravity = Gravity.TOP | Gravity.START;
                      lp.x = (int) RemapConfig.getButtonX(this, logicalId, dm.widthPixels, dm.heightPixels);
                      lp.y = (int) RemapConfig.getButtonY(this, logicalId, dm.widthPixels, dm.heightPixels);

                      tv.setOnTouchListener(new View.OnTouchListener() {
                          float dx, dy;
                          @Override public boolean onTouch(View v, MotionEvent ev) {
                              if (targetsLocked) return false;
                              if (ev.getAction() == MotionEvent.ACTION_DOWN) {
                                  dx = lp.x - ev.getRawX();
                                  dy = lp.y - ev.getRawY();
                              } else if (ev.getAction() == MotionEvent.ACTION_MOVE) {
                                  lp.x = (int) (ev.getRawX() + dx);
                                  lp.y = (int) (ev.getRawY() + dy);
                                  wm.updateViewLayout(tv, lp);
                              } else if (ev.getAction() == MotionEvent.ACTION_UP) {
                                  RemapConfig.saveButtonPos(ControllerAccessibilityService.this, logicalId, lp.x, lp.y);
                              }
                              return true;
                          }
                      });

                      wm.addView(tv, lp);
                      targetViews.put(logicalId, tv);
                      targetParams.put(logicalId, lp);
                  }
              }

              private void updateTargetsLockState() {
                  for (Map.Entry<Integer, View> entry : targetViews.entrySet()) {
                      int id = entry.getKey();
                      View v = entry.getValue();
                      WindowManager.LayoutParams lp = targetParams.get(id);
                      if (lp == null) continue;
                      if (targetsLocked) {
                          lp.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE;
                          v.setAlpha(0.32f);
                      } else {
                          lp.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                          v.setAlpha(0.95f);
                      }
                      wm.updateViewLayout(v, lp);
                  }
              }

              public void removeOverlayHud() {
                  if (!overlayShowing) return;
                  overlayShowing = false;
                  targetsLocked = false;
                  pressedLogicalButtons.clear();
                  activeTouchHoldTargets.clear();
                  try {
                      if (controlBarView != null) wm.removeView(controlBarView);
                  } catch (Exception ignored) {}
                  controlBarView = null;

                  for (View v : targetViews.values()) {
                      try { wm.removeView(v); } catch (Exception ignored) {}
                  }
                  targetViews.clear();
                  targetParams.clear();
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  removeOverlayHud();
                  instance = null;
              }
          }
