              private void sendDualSenseHidCommand(final int r, final int g, final int b, final boolean heavyTrigger) {
                  UsbManager um = (UsbManager) getSystemService(Context.USB_SERVICE);
                  HashMap<String, UsbDevice> list = um.getDeviceList();
                  UsbDevice ps5 = null;
                  for (UsbDevice d : list.values()) {
                      if (d.getVendorId() == 0x054C) {
                          ps5 = d;
                          break;
                      }
                  }
                  if (ps5 == null) {
                      Toast.makeText(this, "تم حفظ إعداد الإضاءة والزناد (وصّل يد PS5 عبر OTG لتطبيق أمر HID المباشر)", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (!um.hasPermission(ps5)) {
                      Intent in = new Intent(ACTION_USB_HID).setPackage(getPackageName());
                      int fl = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0;
                      um.requestPermission(ps5, PendingIntent.getBroadcast(this, 0, in, fl));
                      return;
                  }
                  UsbDeviceConnection conn = um.openDevice(ps5);
                  if (conn != null && ps5.getInterfaceCount() > 0) {
                      UsbInterface intf = ps5.getInterface(0);
                      conn.claimInterface(intf, true);
                      byte[] report = new byte[48];
                      report[0] = 0x02;
                      report[1] = (byte) 0xFF;
                      report[2] = (byte) 0xF7;
                      if (heavyTrigger) {
                          report[11] = 0x01; report[12] = (byte) 0x80; report[13] = (byte) 0xFF;
                          report[22] = 0x01; report[23] = (byte) 0x80; report[24] = (byte) 0xFF;
                      }
                      report[45] = (byte) r;
                      report[46] = (byte) g;
                      report[47] = (byte) b;

                      for (int i = 0; i < intf.getEndpointCount(); i++) {
                          UsbEndpoint ep = intf.getEndpoint(i);
                          if (ep.getDirection() == UsbConstants.USB_DIR_OUT) {
                              conn.bulkTransfer(ep, report, report.length, 1000);
                              break;
                          }
                      }
                      conn.releaseInterface(intf);
                      conn.close();
                      Toast.makeText(this, "تم تحديث إضاءة ومقاومة أزرار يد PS5 بنجاح!", Toast.LENGTH_SHORT).show();
                  }
              }

              private View buildLiveTesterTab() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(12, 12, 12, 12);

                  LinearLayout card = makeCard("#1E293B");
                  card.setOrientation(LinearLayout.VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("فاحص الأزرار وسرعة الاستجابة المباشر (Live Input Monitor):");
                  title.setTextColor(Color.parseColor("#38BDF8"));
                  title.setTextSize(14f);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(title);

                  liveTestOutputTv = new TextView(this);
                  liveTestOutputTv.setText("اضغط على أي زر في يد التحكم (PS5) أو حرك العصا (L3/R3) وأزرار (L2/R2) لاختبار سرعة الاستجابة والوظيفة المعدلة هنا مباشرة...");
                  liveTestOutputTv.setTextColor(Color.parseColor("#F8FAFC"));
                  liveTestOutputTv.setTextSize(14f);
