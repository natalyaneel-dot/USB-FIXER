                  trigCard.addView(dzTv);
                  trigCard.addView(dzSeek);
                  trigCard.addView(turboSpeedTv);
                  trigCard.addView(turboSeek);
                  box.addView(trigCard);

                  LinearLayout ps5Card = makeCard("#1E1B4B");
                  ps5Card.setOrientation(LinearLayout.VERTICAL);

                  TextView ps5Title = new TextView(this);
