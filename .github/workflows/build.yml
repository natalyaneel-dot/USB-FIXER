name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Auto-Fix Code
        run: |
          unzip -o UsbFixer_Android_App_Project.zip
          python3 -c '
          p = "app/src/main/java/com/example/usbfixer/MainActivity.kt"
          s = open(p).read()
          s = s.replace("✅ $fixLog\nاضغط", "✅ $fixLog\\nاضغط")
          s = s.replace("في:\nDownloads", "في:\\nDownloads")
          open(p, "w").write(s)
          '
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UsbFixer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
