              private void showEditMacroDialog(final int slot) {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(30, 20, 30, 20);

                  final Spinner spTrig1 = makeLogicalSpinner(RemapConfig.getMacroTrigger1(this, slot), false);
                  final Spinner spTrig2 = makeLogicalSpinner(RemapConfig.getMacroTrigger2(this, slot), true);
                  final Spinner spStep1 = makeLogicalSpinner(RemapConfig.getMacroStep(this, slot, 0), false);
                  final Spinner spStep2 = makeLogicalSpinner(RemapConfig.getMacroStep(this, slot, 1), false);
                  final Spinner spStep3 = makeLogicalSpinner(RemapConfig.getMacroStep(this, slot, 2), true);

                  final SeekBar delaySeek = new SeekBar(this);
                  delaySeek.setMax(150);
                  delaySeek.setProgress(RemapConfig.getMacroDelayMs(this, slot));
                  final TextView delayTv = new TextView(this);
                  delayTv.setText("الفاصل الزمني: " + delaySeek.getProgress() + " ms (ضع 0 للدمج اللحظي والضغط المطول)");
                  delaySeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean u) {
                          delayTv.setText("الفاصل الزمني: " + p + " ms " + (p <= 5 ? "(دمج في نفس اللحظة)" : "(تتابع سريع)"));
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });

                  layout.addView(makeLabel("1. زر التشغيل الأول (Trigger 1):"));
                  layout.addView(spTrig1);
                  layout.addView(makeLabel("2. زر تشغيل ثانٍ للدمج (اختياري - اضغطهما معاً):"));
                  layout.addView(spTrig2);
                  layout.addView(makeLabel("3. الزر المدمج الأول المراد تنفيذه:"));
                  layout.addView(spStep1);
                  layout.addView(makeLabel("4. الزر المدمج الثاني المراد تنفيذه:"));
                  layout.addView(spStep2);
                  layout.addView(makeLabel("5. الزر المدمج الثالث (اختياري):"));
                  layout.addView(spStep3);
                  layout.addView(delayTv);
                  layout.addView(delaySeek);

                  sv.addView(layout);

                  new AlertDialog.Builder(this)
                      .setTitle("ضبط المايكرو رقم #" + slot)
                      .setView(sv)
                      .setPositiveButton("حفظ وتفعيل", (d, w) -> {
                          int t1 = spTrig1.getSelectedItemPosition();
                          int t2 = spTrig2.getSelectedItemPosition() == 0 ? -1 : (spTrig2.getSelectedItemPosition() - 1);
                          int s1 = spStep1.getSelectedItemPosition();
                          int s2 = spStep2.getSelectedItemPosition();
                          int s3 = spStep3.getSelectedItemPosition() == 0 ? -1 : (spStep3.getSelectedItemPosition() - 1);
                          RemapConfig.saveMacro(this, slot, t1, t2, s1, s2, s3, delaySeek.getProgress());
                          showTab(1);
                          Toast.makeText(this, "تم حفظ وتفعيل المايكرو #" + slot, Toast.LENGTH_SHORT).show();
                      })
                      .setNegativeButton("إلغاء", null)
                      .show();
              }

              private TextView makeLabel(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(12f);
                  tv.setPadding(0, 12, 0, 4);
                  return tv;
              }

              private Spinner makeLogicalSpinner(int currentLogicalId, boolean allowNone) {
                  Spinner sp = new Spinner(this);
                  List<String> items = new ArrayList<>();
                  if (allowNone) items.add("-- بدون (تجاهل) --");
                  Collections.addAll(items, RemapConfig.BUTTON_NAMES);
                  ArrayAdapter<String> ad = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, items);
                  sp.setAdapter(ad);

                  int sel = 0;
                  if (currentLogicalId >= 0 && currentLogicalId < RemapConfig.BUTTON_COUNT) {
                      sel = allowNone ? (currentLogicalId + 1) : currentLogicalId;
                  }
                  sp.setSelection(sel);
                  return sp;
              }

