              private void startPhysicalButtonCalibration(final int logicalId) {
                  calibratingLogicalId = logicalId;
                  ControllerAccessibilityService.calibrationModeActive = true;
                  String btnName = RemapConfig.BUTTON_NAMES[logicalId];

                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("تعريف الزر الفعلي: " + btnName);
                  b.setMessage("اضغط الآن على زر (" + btnName + ") في يد التحكم PS5 الخاصة بك...\n\nسيقوم البرنامج بالتقاط إشارة الزر وحفظه باسمه الحقيقي فوراً!");
