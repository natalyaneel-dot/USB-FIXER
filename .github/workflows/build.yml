                  gd.setColor(Color.parseColor(hex));
                  gd.setCornerRadius(16f);
                  b.setBackground(gd);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  lp.setMargins(5, 4, 5, 4);
                  b.setLayoutParams(lp);
                  b.setPadding(8, 16, 8, 16);
                  return b;
              }

              private Button makeTabBtn(String text, boolean active) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(12f);
                  b.setAllCaps(false);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  lp.setMargins(4, 0, 4, 0);
                  b.setLayoutParams(lp);
                  b.setPadding(6, 14, 6, 14);
                  styleTabBtn(b, active);
                  return b;
              }

              private void styleTabBtn(Button b, boolean active) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setCornerRadius(14f);
                  if (active) {
                      gd.setColor(Color.parseColor("#0284C7"));
                      b.setTextColor(Color.WHITE);
                      b.setTypeface(Typeface.DEFAULT_BOLD);
                  } else {
                      gd.setColor(Color.parseColor("#1E293B"));
                      b.setTextColor(Color.parseColor("#94A3B8"));
                      b.setTypeface(Typeface.DEFAULT);
                  }
                  b.setBackground(gd);
              }

