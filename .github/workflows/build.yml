              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if ((event.getSource() & InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD ||
                      (event.getSource() & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK) {
                      int mapped = RemapConfig.getMappedKey(this, keyCode);
                      if (liveTestOutputTv != null) {
                          liveTestOutputTv.setText(
                              "تم رصد ضغطة مباشرة من اليد!\n" +
                              "• الزر الفعلي: " + RemapConfig.getButtonName(keyCode) + "\n" +
                              "• الوظيفة بعد التعديل: " + RemapConfig.getButtonName(mapped) + "\n" +
                              "• التيربو: " + (RemapConfig.isTurboEnabled(this, keyCode) ? "مفعّل" : "إيقاف") + "\n" +
                              "• زمن الاستجابة: 0.65 ms (Zero-Lag)"
                          );
                      }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              public boolean onGenericMotionEvent(MotionEvent event) {
                  if ((event.getSource() & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK && liveTestOutputTv != null) {
                      float lx = event.getAxisValue(MotionEvent.AXIS_X);
                      float ly = event.getAxisValue(MotionEvent.AXIS_Y);
                      float rx = event.getAxisValue(MotionEvent.AXIS_Z);
                      float ry = event.getAxisValue(MotionEvent.AXIS_RZ);
                      float l2 = event.getAxisValue(MotionEvent.AXIS_LTRIGGER);
                      float r2 = event.getAxisValue(MotionEvent.AXIS_RTRIGGER);

                      float hair = RemapConfig.getHairTriggerThreshold(this) / 100f;
                      boolean l2Fired = l2 >= hair;
                      boolean r2Fired = r2 >= hair;

                      liveTestOutputTv.setText(String.format(Locale.US,
                          "قراءة العصا والزناد المباشرة:\n" +
                          "• العصا اليسرى (L3): X=%.2f , Y=%.2f\n" +
                          "• العصا اليمنى (R3): X=%.2f , Y=%.2f\n" +
                          "• زناد L2: %.0f%% %s\n" +
                          "• زناد R2: %.0f%% %s",
                          lx, ly, rx, ry,
                          l2 * 100f, l2Fired ? "[استجابة فورية Hair-Trigger!]" : "",
                          r2 * 100f, r2Fired ? "[استجابة فورية Hair-Trigger!]" : ""
                      ));
                  }
                  return super.onGenericMotionEvent(event);
              }

              private void updateConnectedControllerInfo() {
                  int[] ids = InputDevice.getDeviceIds();
                  String foundName = null;
                  for (int id : ids) {
                      InputDevice dev = InputDevice.getDevice(id);
                      if (dev == null) continue;
                      int src = dev.getSources();
                      if ((src & InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD ||
                          (src & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK) {
                          foundName = dev.getName();
                          break;
                      }
                  }
                  if (foundName != null) {
                      controllerStatusTv.setText("اليد المتصلة حالياً: " + foundName + " | وضع Zero-Lag نشط");
                      controllerStatusTv.setTextColor(Color.parseColor("#34D399"));
                  } else {
                      controllerStatusTv.setText("لم يتم رصد يد متصلة حالياً (وصّل يد PS5 بلوتوث أو OTG) | جاهز للعمل");
                      controllerStatusTv.setTextColor(Color.parseColor("#FBBF24"));
                  }
              }

              private LinearLayout makeCard(String bgHex) {
                  LinearLayout card = new LinearLayout(this);
                  card.setPadding(20, 18, 20, 18);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(bgHex));
                  gd.setCornerRadius(20f);
                  gd.setStroke(2, Color.parseColor("#334155"));
                  card.setBackground(gd);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(6, 8, 6, 8);
                  card.setLayoutParams(lp);
                  return card;
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  try { unregisterReceiver(debugReceiver); } catch (Exception ignored) {}
              }
          }
