                  ps5Title.setTextColor(Color.parseColor("#C084FC"));
                  ps5Title.setTextSize(14f);
                  ps5Title.setTypeface(Typeface.DEFAULT_BOLD);
                  ps5Card.addView(ps5Title);

                  TextView ps5Sub = new TextView(this);
                  ps5Sub.setText("تحكم بلون إضاءة يد PS5 (Lightbar RGB) وقوة مقاومة أزرار (L2/R2 Adaptive Triggers):");
                  ps5Sub.setTextColor(Color.parseColor("#CBD5E1"));
