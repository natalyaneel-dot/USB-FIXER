                  Button ledGreen = makeBtn("أخضر", "#059669");
                  Button ledPurple = makeBtn("بنفسجي", "#7C3AED");

                  ledBlue.setOnClickListener(v -> sendDualSenseHidCommand(0, 40, 255, false));
                  ledRed.setOnClickListener(v -> sendDualSenseHidCommand(255, 10, 10, false));
                  ledGreen.setOnClickListener(v -> sendDualSenseHidCommand(10, 255, 40, false));
                  ledPurple.setOnClickListener(v -> sendDualSenseHidCommand(180, 10, 255, false));

                  ledRow.addView(ledBlue); ledRow.addView(ledRed); ledRow.addView(ledGreen); ledRow.addView(ledPurple);
