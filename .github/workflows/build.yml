              private View buildMacroTab() {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(6, 6, 6, 20);

                  TextView info = new TextView(this);
                  info.setText("استوديو المايكرو الاحترافي: يمكنك دمج زرارين أو 3 أزرار لتعمل معاً بضغطة زر واحدة، أو تخصيص ضغطة مزدوجة (مثلاً L1 + R1 معاً) لتنفيذ كومبو فوري:");
                  info.setTextColor(Color.parseColor("#CBD5E1"));
                  info.setTextSize(12f);
                  info.setPadding(6, 4, 6, 12);
                  box.addView(info);

                  for (int slot = 1; slot <= 3; slot++) {
                      final int s = slot;
                      boolean en = RemapConfig.isMacroEnabled(this, s);
                      int trig1 = RemapConfig.getMacroTrigger1(this, s);
                      int trig2 = RemapConfig.getMacroTrigger2(this, s);
                      int step1 = RemapConfig.getMacroStep(this, s, 0);
                      int step2 = RemapConfig.getMacroStep(this, s, 1);
                      int step3 = RemapConfig.getMacroStep(this, s, 2);
                      int delay = RemapConfig.getMacroDelayMs(this, s);

                      LinearLayout card = makeCard("#1E293B");
                      card.setOrientation(LinearLayout.VERTICAL);

                      LinearLayout head = new LinearLayout(this);
                      head.setOrientation(LinearLayout.HORIZONTAL);
                      head.setGravity(Gravity.CENTER_VERTICAL);

                      TextView title = new TextView(this);
                      title.setText("مايكرو رقم #" + s + (trig2 > 0 ? " (دمج زرين معاً)" : " (بضغطة زر واحد)"));
                      title.setTextColor(Color.parseColor("#38BDF8"));
                      title.setTextSize(14f);
                      title.setTypeface(Typeface.DEFAULT_BOLD);
                      title.setLayoutParams(new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                      CheckBox sw = new CheckBox(this);
                      sw.setText("مفعّل");
                      sw.setTextColor(Color.GREEN);
                      sw.setChecked(en);
                      sw.setOnCheckedChangeListener((b, chk) -> RemapConfig.setMacroEnabled(this, s, chk));

                      head.addView(title);
                      head.addView(sw);
                      card.addView(head);

                      String trigDesc = (trig2 > 0)
                              ? (RemapConfig.getShortLabel(trig1) + " + " + RemapConfig.getShortLabel(trig2) + " معاً")
                              : RemapConfig.getButtonName(trig1);

                      String stepsDesc = RemapConfig.getShortLabel(step1) + " + " +
                                         RemapConfig.getShortLabel(step2) +
                                         (step3 > 0 ? (" + " + RemapConfig.getShortLabel(step3)) : "");

                      TextView details = new TextView(this);
                      details.setText(
                          "• زر التشغيل: [" + trigDesc + "]\n" +
                          "• الأزرار المدمجة التي تُنفّذ: [" + stepsDesc + "]\n" +
                          "• نمط التنفيذ: " + (delay <= 5 ? "في نفس اللحظة (Simultaneous 0ms)" : ("متتالي سريع (" + delay + " ms)"))
                      );
                      details.setTextColor(Color.WHITE);
                      details.setTextSize(12f);
                      details.setPadding(4, 10, 4, 12);
                      card.addView(details);

                      LinearLayout btnRow = new LinearLayout(this);
                      btnRow.setOrientation(LinearLayout.HORIZONTAL);

                      Button editBtn = makeBtn("تخصيص أزرار المايكرو #" + s, "#7C3AED");
                      editBtn.setOnClickListener(v -> showEditMacroDialog(s));

                      btnRow.addView(editBtn);
                      card.addView(btnRow);

                      box.addView(card);
                  }

                  sv.addView(box);
                  return sv;
              }

              private void showEditMacroDialog(final int slot) {
                  ScrollView sv = new ScrollView(this);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(30, 20, 30, 20);

                  final Spinner spTrig1 = makeKeySpinner(RemapConfig.getMacroTrigger1(this, slot), false);
                  final Spinner spTrig2 = makeKeySpinner(RemapConfig.getMacroTrigger2(this, slot), true);
                  final Spinner spStep1 = makeKeySpinner(RemapConfig.getMacroStep(this, slot, 0), false);
                  final Spinner spStep2 = makeKeySpinner(RemapConfig.getMacroStep(this, slot, 1), false);
                  final Spinner spStep3 = makeKeySpinner(RemapConfig.getMacroStep(this, slot, 2), true);

                  final SeekBar delaySeek = new SeekBar(this);
                  delaySeek.setMax(150);
                  delaySeek.setProgress(RemapConfig.getMacroDelayMs(this, slot));
                  final TextView delayTv = new TextView(this);
                  delayTv.setText("الفاصل الزمني بين الأزرار: " + delaySeek.getProgress() + " ms (ضع 0 للدمج اللحظي)");
                  delaySeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean u) {
                          delayTv.setText("الفاصل الزمني: " + p + " ms " + (p <= 5 ? "(دمج في نفس اللحظة)" : "(تتابع سريع)"));
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });

                  layout.addView(makeLabel("1. زر التشغيل الأول (Trigger 1):"));
                  layout.addView(spTrig1);
                  layout.addView(makeLabel("2. زر تشغيل إضافي للدمج (اختياري - اضغطهما معاً):"));
                  layout.addView(spTrig2);
                  layout.addView(makeLabel("3. الزر المدمج الأول المراد تنفيذه:"));
                  layout.addView(spStep1);
                  layout.addView(makeLabel("4. الزر المدمج الثاني المراد تنفيذه:"));
                  layout.addView(spStep2);
                  layout.addView(makeLabel("5. الزر المدمج الثالث (اختياري):"));
                  layout.addView(spStep3);
                  layout.addView(delayTv);
                  layout.addView(delaySeek);

                  sv.addView(layout);

                  new AlertDialog.Builder(this)
                      .setTitle("ضبط المايكرو رقم #" + slot)
                      .setView(sv)
                      .setPositiveButton("حفظ المايكرو", (d, w) -> {
                          int t1 = RemapConfig.BUTTON_CODES[spTrig1.getSelectedItemPosition()];
                          int t2 = spTrig2.getSelectedItemPosition() == 0 ? 0 : RemapConfig.BUTTON_CODES[spTrig2.getSelectedItemPosition() - 1];
                          int s1 = RemapConfig.BUTTON_CODES[spStep1.getSelectedItemPosition()];
                          int s2 = RemapConfig.BUTTON_CODES[spStep2.getSelectedItemPosition()];
                          int s3 = spStep3.getSelectedItemPosition() == 0 ? 0 : RemapConfig.BUTTON_CODES[spStep3.getSelectedItemPosition() - 1];
                          RemapConfig.saveMacro(this, slot, t1, t2, s1, s2, s3, delaySeek.getProgress());
                          showTab(1);
                          Toast.makeText(this, "تم حفظ المايكرو #" + slot + " بنجاح!", Toast.LENGTH_SHORT).show();
                      })
                      .setNegativeButton("إلغاء", null)
                      .show();
              }

              private TextView makeLabel(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(12f);
                  tv.setPadding(0, 12, 0, 4);
                  return tv;
              }

              private Spinner makeKeySpinner(int currentKeyCode, boolean allowNone) {
                  Spinner sp = new Spinner(this);
                  List<String> items = new ArrayList<>();
                  if (allowNone) items.add("-- بدون (تجاهل) --");
                  Collections.addAll(items, RemapConfig.BUTTON_NAMES);
                  ArrayAdapter<String> ad = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, items);
                  sp.setAdapter(ad);

                  int sel = 0;
                  for (int i = 0; i < RemapConfig.BUTTON_CODES.length; i++) {
                      if (RemapConfig.BUTTON_CODES[i] == currentKeyCode) {
                          sel = allowNone ? (i + 1) : i;
                          break;
                      }
                  }
                  sp.setSelection(sel);
                  return sp;
              }

