name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build DualSense Pro v2 APK
        run: |
          rm -rf app build.gradle* settings.gradle* gradle.properties
          mkdir -p app/src/main/java/com/example/dualsensepro app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DualSensePro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.dualsensepro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.dualsensepro"
                  minSdk 24
                  targetSdk 33
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestFilterKeyEvents|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="5" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:label="DualSense Pro v2" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".ControllerAccessibilityService" android:label="محرك أزرار PS5 والمايكرو الاحترافي" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/dualsensepro/RemapConfig.java
          package com.example.dualsensepro;
          import android.content.*;
          import android.view.KeyEvent;

          public class RemapConfig {
              private static final String PREFS = "ds_pro_v2";
              public static final int BTN_CROSS = 0, BTN_CIRCLE = 1, BTN_SQUARE = 2, BTN_TRIANGLE = 3;
              public static final int BTN_L1 = 4, BTN_R1 = 5, BTN_L2 = 6, BTN_R2 = 7, BTN_L3 = 8, BTN_R3 = 9;
              public static final int BTN_UP = 10, BTN_DOWN = 11, BTN_LEFT = 12, BTN_RIGHT = 13;
              public static final int BUTTON_COUNT = 14;

              public static final int[] DEFAULT_PS5_CODES = {
                  KeyEvent.KEYCODE_BUTTON_B, KeyEvent.KEYCODE_BUTTON_C, KeyEvent.KEYCODE_BUTTON_A, KeyEvent.KEYCODE_BUTTON_X,
                  KeyEvent.KEYCODE_BUTTON_Y, KeyEvent.KEYCODE_BUTTON_Z, KeyEvent.KEYCODE_BUTTON_L1, KeyEvent.KEYCODE_BUTTON_R1,
                  KeyEvent.KEYCODE_BUTTON_SELECT, KeyEvent.KEYCODE_BUTTON_START,
                  KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT
              };

              public static final String[] BUTTON_NAMES = {
                  "✕ (إكس - Cross)", "◯ (دائرة - Circle)", "□ (مربع - Square)", "△ (مثلث - Triangle)",
                  "L1 (الكتف الأيسر)", "R1 (الكتف الأيمن)", "L2 (الزناد الأيسر)", "R2 (الزناد الأيمن)",
                  "L3 (العصا اليسرى)", "R3 (العصا اليمنى)", "سهم لأعلى", "سهم لأسفل", "سهم لليسار", "سهم لليمين"
              };

              public static final String[] IN_GAME_NAMES = {
                  "داخل اللعبة: Button B", "داخل اللعبة: Button C", "داخل اللعبة: Button A", "داخل اللعبة: Button X",
                  "داخل اللعبة: Button Y", "داخل اللعبة: Button Z", "داخل اللعبة: Button L1", "داخل اللعبة: Button R1",
                  "داخل اللعبة: Select/L3", "داخل اللعبة: Start/R3", "D-Pad Up", "D-Pad Down", "D-Pad Left", "D-Pad Right"
              };

              public static final String[] SHORT_LABELS = {"✕","◯","□","△","L1","R1","L2","R2","L3","R3","↑","↓","←","→"};

              private static SharedPreferences p(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }
              public static int getHwCode(Context c, int id) { return p(c).getInt("hw_" + id, DEFAULT_PS5_CODES[id]); }
              public static void setHwCode(Context c, int id, int code) { p(c).edit().putInt("hw_" + id, code).apply(); }
              public static void resetHw(Context c) {
                  SharedPreferences.Editor e = p(c).edit();
                  for (int i = 0; i < BUTTON_COUNT; i++) e.putInt("hw_" + i, DEFAULT_PS5_CODES[i]);
                  e.apply();
              }
              public static int findIdByCode(Context c, int code) {
                  for (int i = 0; i < BUTTON_COUNT; i++) if (getHwCode(c, i) == code) return i;
                  if (code == KeyEvent.KEYCODE_BUTTON_THUMBL) return BTN_L3;
                  if (code == KeyEvent.KEYCODE_BUTTON_THUMBR) return BTN_R3;
                  return -1;
              }
              public static int getMappedId(Context c, int id) { return p(c).getInt("map_" + id, id); }
              public static void setMappedId(Context c, int id, int target) { p(c).edit().putInt("map_" + id, target).apply(); }
              public static void resetMaps(Context c) {
                  SharedPreferences.Editor e = p(c).edit();
                  for (int i = 0; i < BUTTON_COUNT; i++) { e.putInt("map_" + i, i); e.putBoolean("tb_" + i, false); }
                  e.apply();
              }
              public static boolean isTurbo(Context c, int id) { return p(c).getBoolean("tb_" + id, false); }
              public static void setTurbo(Context c, int id, boolean en) { p(c).edit().putBoolean("tb_" + id, en).apply(); }
              public static boolean isHold(Context c) { return p(c).getBoolean("hold", true); }
              public static void setHold(Context c, boolean en) { p(c).edit().putBoolean("hold", en).apply(); }
              public static int getHudCount(Context c) { return p(c).getInt("hud_cnt", 6); }
              public static void setHudCount(Context c, int cnt) { p(c).edit().putInt("hud_cnt", cnt).apply(); }

              public static float getX(Context c, int id, int w, int h) {
                  int mw = Math.max(w, h);
                  float def = (id == 0) ? mw * 0.77f : (id == 1 ? mw * 0.87f : (id == 2 ? mw * 0.67f : (id == 3 ? mw * 0.77f : 160f + (id % 5) * 130f)));
                  return p(c).getFloat("px_" + id, def);
              }
              public static float getY(Context c, int id, int w, int h) {
                  int mh = Math.min(w, h);
                  float def = (id == 0) ? mh * 0.70f : (id == 1 ? mh * 0.50f : (id == 2 ? mh * 0.70f : (id == 3 ? mh * 0.42f : 180f + (id / 5) * 130f)));
                  return p(c).getFloat("py_" + id, def);
              }
              public static void savePos(Context c, int id, float x, float y) { p(c).edit().putFloat("px_" + id, x).putFloat("py_" + id, y).apply(); }
              public static void applySideswipe(Context c, int w, int h) {
                  int mw = Math.max(w, h), mh = Math.min(w, h);
                  p(c).edit()
                      .putFloat("px_0", mw * 0.77f).putFloat("py_0", mh * 0.70f)
                      .putFloat("px_1", mw * 0.87f).putFloat("py_1", mh * 0.50f)
                      .putFloat("px_2", mw * 0.67f).putFloat("py_2", mh * 0.70f)
                      .putFloat("px_3", mw * 0.77f).putFloat("py_3", mh * 0.42f)
                      .putFloat("px_4", mw * 0.15f).putFloat("py_4", mh * 0.25f)
                      .putFloat("px_5", mw * 0.85f).putFloat("py_5", mh * 0.25f).apply();
              }

              public static boolean isMacroEn(Context c, int s) { return p(c).getBoolean("m_en_" + s, false); }
              public static void setMacroEn(Context c, int s, boolean en) { p(c).edit().putBoolean("m_en_" + s, en).apply(); }
              public static int getMacroT1(Context c, int s) { return p(c).getInt("m_t1_" + s, s == 1 ? BTN_L1 : (s == 2 ? BTN_R1 : BTN_L3)); }
              public static int getMacroT2(Context c, int s) { return p(c).getInt("m_t2_" + s, -1); }
              public static int getMacroS(Context c, int s, int idx) { return p(c).getInt("m_s_" + s + "_" + idx, idx == 0 ? BTN_CROSS : (idx == 1 ? BTN_CIRCLE : -1)); }
              public static int getMacroDelay(Context c, int s) { return p(c).getInt("m_del_" + s, 0); }
              public static void saveMacro(Context c, int s, int t1, int t2, int s1, int s2, int s3, int del) {
                  p(c).edit().putBoolean("m_en_" + s, true).putInt("m_t1_" + s, t1).putInt("m_t2_" + s, t2)
                      .putInt("m_s_" + s + "_0", s1).putInt("m_s_" + s + "_1", s2).putInt("m_s_" + s + "_2", s3).putInt("m_del_" + s, del).apply();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/dualsensepro/ControllerAccessibilityService.java
          package com.example.dualsensepro;
          import android.accessibilityservice.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.os.*;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.*;
          import java.util.*;

          public class ControllerAccessibilityService extends AccessibilityService {
              public static ControllerAccessibilityService instance;
              public static final String ACTION_DEBUG = "com.example.dualsensepro.DBG";
              public static volatile boolean calibrating = false;
              private WindowManager wm;
              private View barView;
              private final Map<Integer, View> views = new HashMap<>();
              private final Map<Integer, WindowManager.LayoutParams> params = new HashMap<>();
              private boolean showing = false, locked = false;
              private final Set<Integer> pressed = new HashSet<>();
              private final Set<Integer> holdTargets = new LinkedHashSet<>();
              private final long[] lastMs = new long[14];
              private final Map<Integer, Runnable> turbos = new HashMap<>();
              private final Handler h = new Handler(Looper.getMainLooper());

              @Override protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  try { android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_DISPLAY); } catch (Exception ignored) {}
                  Toast.makeText(this, "تم تفعيل محرك أزرار PS5 بنجاح", Toast.LENGTH_SHORT).show();
              }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              @Override protected boolean onKeyEvent(KeyEvent ev) {
                  int code = ev.getKeyCode(), act = ev.getAction();
                  if (code == KeyEvent.KEYCODE_BACK || code == KeyEvent.KEYCODE_HOME || code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_DOWN) return false;
                  int id = RemapConfig.findIdByCode(this, code);
                  int mapId = id >= 0 ? RemapConfig.getMappedId(this, id) : -1;

                  Intent i = new Intent(ACTION_DEBUG).setPackage(getPackageName());
                  i.putExtra("raw", code).putExtra("id", id).putExtra("mapId", mapId).putExtra("act", act);
                  sendBroadcast(i);

                  if (calibrating) return true;
                  if (!showing || !locked) {
                      if (act == KeyEvent.ACTION_UP) { pressed.clear(); holdTargets.clear(); }
                      return false;
                  }
                  if (id >= 10 && id <= 13 && !params.containsKey(mapId)) return false;
                  if (id < 0) return false;

                  if (act == KeyEvent.ACTION_DOWN) {
                      if (ev.getRepeatCount() > 0) return true;
                      long now = System.currentTimeMillis();
                      if (now - lastMs[id] < 18) return true;
                      lastMs[id] = now;
                      if (!pressed.add(id)) return true;

                      for (int s = 1; s <= 3; s++) {
                          if (!RemapConfig.isMacroEn(this, s)) continue;
                          int t1 = RemapConfig.getMacroT1(this, s), t2 = RemapConfig.getMacroT2(this, s);
                          if ((t2 >= 0 && ((id == t1 && pressed.contains(t2)) || (id == t2 && pressed.contains(t1)))) || (t2 < 0 && id == t1)) {
                              runMacro(s);
                              return true;
                          }
                      }
                      if (RemapConfig.isTurbo(this, id)) {
                          tap(mapId, 40);
                          Runnable r = new Runnable() { @Override public void run() { if (pressed.contains(id) && showing && locked) { tap(mapId, 35); h.postDelayed(this, 50); } } };
                          turbos.put(id, r); h.postDelayed(r, 50);
                      } else if (RemapConfig.isHold(this)) {
                          holdTargets.add(mapId);
                          updateHold();
                      } else tap(mapId, 55);
                      return true;
                  } else if (act == KeyEvent.ACTION_UP) {
                      pressed.remove(id);
                      Runnable r = turbos.remove(id); if (r != null) h.removeCallbacks(r);
                      for (int s = 1; s <= 3; s++) {
                          if (RemapConfig.isMacroEn(this, s) && RemapConfig.getMacroT1(this, s) == id) {
                              holdTargets.remove(RemapConfig.getMacroS(this, s, 0));
                              holdTargets.remove(RemapConfig.getMacroS(this, s, 1));
                              holdTargets.remove(RemapConfig.getMacroS(this, s, 2));
                          }
                      }
                      if (holdTargets.remove(mapId) || RemapConfig.isHold(this)) updateHold();
                      return true;
                  }
                  return false;
              }

              private void updateHold() {
                  if (Build.VERSION.SDK_INT < 24) return;
                  if (holdTargets.isEmpty()) {
                      Path p = new Path(); p.moveTo(2f, 2f);
                      dispatchGesture(new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p, 0, 1)).build(), null, null);
                      return;
                  }
                  GestureDescription.Builder b = new GestureDescription.Builder();
                  int k = 0;
                  for (int tid : holdTargets) {
                      float[] xy = center(tid);
                      Path p = new Path(); p.moveTo(xy[0] + k, xy[1]); p.lineTo(xy[0] + k + 1f, xy[1] + 1f);
                      b.addStroke(new GestureDescription.StrokeDescription(p, 0, 12000));
                      k++;
                  }
                  if (k > 0) dispatchGesture(b.build(), null, null);
              }

              private void runMacro(int s) {
                  int s1 = RemapConfig.getMacroS(this, s, 0), s2 = RemapConfig.getMacroS(this, s, 1), s3 = RemapConfig.getMacroS(this, s, 2);
                  int del = RemapConfig.getMacroDelay(this, s);
                  if (del <= 5 && RemapConfig.isHold(this)) {
                      if (s1 >= 0) holdTargets.add(s1);
                      if (s2 >= 0) holdTargets.add(s2);
                      if (s3 >= 0) holdTargets.add(s3);
                      updateHold();
                  } else {
                      if (s1 >= 0) tap(s1, 50);
                      if (s2 >= 0) h.postDelayed(() -> tap(s2, 50), Math.max(10, del));
                      if (s3 >= 0) h.postDelayed(() -> tap(s3, 50), Math.max(20, del * 2L));
                  }
              }

              private void tap(int tid, int ms) {
                  if (Build.VERSION.SDK_INT < 24 || tid < 0) return;
                  float[] xy = center(tid);
                  Path p = new Path(); p.moveTo(xy[0], xy[1]);
                  dispatchGesture(new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p, 0, ms)).build(), null, null);
              }

              private float[] center(int id) {
                  WindowManager.LayoutParams lp = params.get(id);
                  if (lp != null) return new float[]{lp.x + 52f, lp.y + 52f};
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  return new float[]{RemapConfig.getX(this, id, dm.widthPixels, dm.heightPixels) + 52f, RemapConfig.getY(this, id, dm.widthPixels, dm.heightPixels) + 52f};
              }

              public void toggleHud() {
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) return;
                  if (showing) removeHud(); else showHud();
              }

              public void refreshHud() { if (showing) { removeHud(); showHud(); } }

              private void showHud() {
                  if (showing) return;
                  showing = true; locked = false;
                  int type = Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE;
                  DisplayMetrics dm = getResources().getDisplayMetrics();

                  LinearLayout bar = new LinearLayout(this);
                  bar.setPadding(14, 8, 14, 8);
                  GradientDrawable bg = new GradientDrawable(); bg.setColor(Color.argb(230, 15, 23, 42)); bg.setCornerRadius(28f); bg.setStroke(2, Color.CYAN);
                  bar.setBackground(bg);

                  TextView t = new TextView(this); t.setText("PS5 HUD "); t.setTextColor(Color.CYAN); t.setTypeface(Typeface.DEFAULT_BOLD);
                  Button lockBtn = new Button(this); lockBtn.setText("حرّك الدوائر ثم اضغط للقفل واللعب"); lockBtn.setTextSize(11f); lockBtn.setAllCaps(false); lockBtn.setTextColor(Color.WHITE); lockBtn.setBackgroundColor(Color.parseColor("#059669"));
                  Button closeBtn = new Button(this); closeBtn.setText("إغلاق"); closeBtn.setTextSize(11f); closeBtn.setAllCaps(false); closeBtn.setTextColor(Color.WHITE); closeBtn.setBackgroundColor(Color.RED);
                  bar.addView(t); bar.addView(lockBtn); bar.addView(closeBtn);

                  WindowManager.LayoutParams blp = new WindowManager.LayoutParams(-2, -2, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  blp.gravity = Gravity.TOP | Gravity.START; blp.x = 40; blp.y = 30;
                  t.setOnTouchListener(new View.OnTouchListener() {
                      float dx, dy;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) { dx = blp.x - e.getRawX(); dy = blp.y - e.getRawY(); }
                          else if (e.getAction() == MotionEvent.ACTION_MOVE) { blp.x = (int)(e.getRawX() + dx); blp.y = (int)(e.getRawY() + dy); wm.updateViewLayout(bar, blp); }
                          return true;
                      }
                  });
                  lockBtn.setOnClickListener(v -> {
                      locked = !locked; pressed.clear(); holdTargets.clear();
                      lockBtn.setText(locked ? "مقفل للعب (الأزرار نشطة)" : "حرّك الدوائر ثم اضغط للقفل واللعب");
                      lockBtn.setBackgroundColor(Color.parseColor(locked ? "#2563EB" : "#059669"));
                      for (Map.Entry<Integer, View> en : views.entrySet()) {
                          WindowManager.LayoutParams lp = params.get(en.getKey());
                          lp.flags = locked ? (WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE) : WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                          en.getValue().setAlpha(locked ? 0.35f : 0.95f);
                          wm.updateViewLayout(en.getValue(), lp);
                      }
                  });
                  closeBtn.setOnClickListener(v -> removeHud());
                  wm.addView(bar, blp); barView = bar;

                  String[] hints = {"قفز ✕","تيربو ◯","شقلبة □","مثلث △","L1","R1","L2","R2","L3","R3","↑","↓","←","→"};
                  String[] cols = {"#2563EB","#DC2626","#9333EA","#059669","#0284C7","#0284C7","#4F46E5","#4F46E5","#334155","#334155","#334155","#334155","#334155","#334155"};
                  int cnt = Math.min(RemapConfig.getHudCount(this), 14);
                  for (int i = 0; i < cnt; i++) {
                      final int id = i;
                      TextView tv = new TextView(this);
                      tv.setText(hints[i]); tv.setTextColor(Color.WHITE); tv.setTextSize(12f); tv.setTypeface(Typeface.DEFAULT_BOLD); tv.setGravity(Gravity.CENTER);
                      GradientDrawable c = new GradientDrawable(); c.setShape(GradientDrawable.OVAL);
                      int bc = Color.parseColor(cols[i]); c.setColor(Color.argb(180, Color.red(bc), Color.green(bc), Color.blue(bc))); c.setStroke(3, Color.WHITE);
                      tv.setBackground(c);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(104, 104, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP | Gravity.START;
                      lp.x = (int) RemapConfig.getX(this, id, dm.widthPixels, dm.heightPixels);
                      lp.y = (int) RemapConfig.getY(this, id, dm.widthPixels, dm.heightPixels);
                      tv.setOnTouchListener(new View.OnTouchListener() {
                          float dx, dy;
                          @Override public boolean onTouch(View v, MotionEvent e) {
                              if (locked) return false;
                              if (e.getAction() == MotionEvent.ACTION_DOWN) { dx = lp.x - e.getRawX(); dy = lp.y - e.getRawY(); }
                              else if (e.getAction() == MotionEvent.ACTION_MOVE) { lp.x = (int)(e.getRawX() + dx); lp.y = (int)(e.getRawY() + dy); wm.updateViewLayout(tv, lp); }
                              else if (e.getAction() == MotionEvent.ACTION_UP) RemapConfig.savePos(ControllerAccessibilityService.this, id, lp.x, lp.y);
                              return true;
                          }
                      });
                      wm.addView(tv, lp); views.put(id, tv); params.put(id, lp);
                  }
              }

              public void removeHud() {
                  if (!showing) return;
                  showing = false; locked = false; pressed.clear(); holdTargets.clear();
                  try { if (barView != null) wm.removeView(barView); } catch (Exception ignored) {}
                  barView = null;
                  for (View v : views.values()) { try { wm.removeView(v); } catch (Exception ignored) {} }
                  views.clear(); params.clear();
              }
              @Override public void onDestroy() { super.onDestroy(); removeHud(); instance = null; }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/dualsensepro/MainActivity.java
          package com.example.dualsensepro;
          import android.app.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {
              private TextView testTv;
              private FrameLayout box;
              private int tab = 0, calId = -1;
              private AlertDialog calDlg;

              private final BroadcastReceiver rx = new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) {
                      if (i.getIntExtra("act", -1) == KeyEvent.ACTION_DOWN) {
                          int raw = i.getIntExtra("raw", 0), id = i.getIntExtra("id", -1), mapId = i.getIntExtra("mapId", -1);
                          handleKey(raw, id, mapId);
                      }
                  }
              };

              private void handleKey(int raw, int id, int mapId) {
                  if (calId >= 0) {
                      RemapConfig.setHwCode(this, calId, raw);
                      String nm = RemapConfig.BUTTON_NAMES[calId];
                      calId = -1; ControllerAccessibilityService.calibrating = false;
                      if (calDlg != null) { try { calDlg.dismiss(); } catch (Exception ignored) {} calDlg = null; }
                      showTab(tab);
                      Toast.makeText(this, "تم تعريف الزر (" + nm + ") بنجاح!", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (testTv != null) {
                      String n1 = id >= 0 ? RemapConfig.BUTTON_NAMES[id] : ("كود خام: " + raw);
                      String n2 = mapId >= 0 ? RemapConfig.BUTTON_NAMES[mapId] : n1;
                      String n3 = id >= 0 ? RemapConfig.IN_GAME_NAMES[id] : "";
                      testTv.setText("الزر الحقيقي في PS5: " + n1 + "\nالوظيفة المنفذة: " + n2 + "\n" + n3 + "\nالاستجابة: 0.50 ms");
                  }
              }

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#0B0F19"));
                  root.setPadding(16, 20, 16, 12);

                  TextView h = new TextView(this);
                  h.setText("DualSense PS5 Pro v2 (الأسماء المصححة)");
                  h.setTextSize(17f); h.setTextColor(Color.parseColor("#38BDF8")); h.setTypeface(Typeface.DEFAULT_BOLD); h.setGravity(Gravity.CENTER);
                  root.addView(h);

                  LinearLayout top = new LinearLayout(this);
                  Button b1 = btn("1. تفعيل المحرك", "#2563EB");
                  Button b2 = btn("2. تشغيل رادار الألعاب", "#059669");
                  b1.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  b2.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                          return;
                      }
                      if (ControllerAccessibilityService.instance != null) ControllerAccessibilityService.instance.toggleHud();
                      else startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  });
                  top.addView(b1); top.addView(b2);
                  root.addView(top);

                  LinearLayout tabs = new LinearLayout(this);
                  tabs.setPadding(0, 10, 0, 8);
                  String[] tNames = {"الأزرار والمعايرة", "المايكرو", "روكت ليغ", "الفاحص"};
                  for (int i = 0; i < 4; i++) {
                      final int idx = i;
                      Button tb = btn(tNames[i], "#1E293B");
                      tb.setOnClickListener(v -> showTab(idx));
                      tabs.addView(tb);
                  }
                  root.addView(tabs);

                  box = new FrameLayout(this);
                  root.addView(box, new LinearLayout.LayoutParams(-1, 0, 1f));
                  setContentView(root);
                  showTab(0);

                  IntentFilter f = new IntentFilter(ControllerAccessibilityService.ACTION_DEBUG);
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(rx, f, Context.RECEIVER_EXPORTED);
                  else registerReceiver(rx, f);
              }

              private Button btn(String t, String hex) {
                  Button b = new Button(this); b.setText(t); b.setTextColor(Color.WHITE); b.setTextSize(11f); b.setAllCaps(false);
                  GradientDrawable g = new GradientDrawable(); g.setColor(Color.parseColor(hex)); g.setCornerRadius(14f); b.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -2, 1f); lp.setMargins(4, 4, 4, 4); b.setLayoutParams(lp);
                  return b;
              }

              private LinearLayout card(String hex) {
                  LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(16, 14, 16, 14);
                  GradientDrawable g = new GradientDrawable(); g.setColor(Color.parseColor(hex)); g.setCornerRadius(16f); l.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2); lp.setMargins(4, 6, 4, 6); l.setLayoutParams(lp);
                  return l;
              }

              private void showTab(int idx) {
                  tab = idx; box.removeAllViews();
                  ScrollView sv = new ScrollView(this);
                  LinearLayout col = new LinearLayout(this); col.setOrientation(LinearLayout.VERTICAL);
                  if (idx == 0) {
                      LinearLayout r0 = new LinearLayout(this);
                      Button rm = btn("إلغاء تعديل الوظائف", "#475569");
                      Button rh = btn("ضبط مصنع لأكواد PS5", "#0369A1");
                      rm.setOnClickListener(v -> { RemapConfig.resetMaps(this); showTab(0); });
                      rh.setOnClickListener(v -> { RemapConfig.resetHw(this); showTab(0); });
                      r0.addView(rm); r0.addView(rh); col.addView(r0);

                      for (int i = 0; i < RemapConfig.BUTTON_COUNT; i++) {
                          final int id = i;
                          int mapId = RemapConfig.getMappedId(this, id);
                          LinearLayout c = card(id != mapId ? "#0369A1" : "#1E293B");
                          TextView tv = new TextView(this);
                          tv.setText("الزر الحقيقي: " + RemapConfig.BUTTON_NAMES[id] + "\nالوظيفة المنفذة: " + RemapConfig.BUTTON_NAMES[mapId] + "\n" + RemapConfig.IN_GAME_NAMES[id]);
                          tv.setTextColor(Color.WHITE); tv.setTextSize(12f);
                          c.addView(tv);

                          LinearLayout br = new LinearLayout(this);
                          Button bChg = btn("تغيير الوظيفة", "#2563EB");
                          Button bCal = btn("تعريف بالضغط", "#059669");
                          CheckBox cb = new CheckBox(this); cb.setText("تيربو"); cb.setTextColor(Color.YELLOW); cb.setChecked(RemapConfig.isTurbo(this, id));
                          cb.setOnCheckedChangeListener((x, chk) -> RemapConfig.setTurbo(this, id, chk));
                          bChg.setOnClickListener(v -> new AlertDialog.Builder(this).setTitle("اختر الوظيفة الجديدة:").setItems(RemapConfig.BUTTON_NAMES, (d, w) -> { RemapConfig.setMappedId(this, id, w); showTab(0); }).show());
                          bCal.setOnClickListener(v -> {
                              calId = id; ControllerAccessibilityService.calibrating = true;
                              calDlg = new AlertDialog.Builder(this).setTitle("اضغط على زر " + RemapConfig.BUTTON_NAMES[id] + " في يدك الآن")
                                  .setNegativeButton("إلغاء", (d, w) -> { calId = -1; ControllerAccessibilityService.calibrating = false; }).show();
                          });
                          br.addView(bChg); br.addView(bCal); br.addView(cb);
                          c.addView(br); col.addView(c);
                      }
                  } else if (idx == 1) {
                      for (int s = 1; s <= 3; s++) {
                          final int slot = s;
                          LinearLayout c = card("#1E293B");
                          CheckBox cb = new CheckBox(this); cb.setText("تفعيل مايكرو #" + slot); cb.setTextColor(Color.CYAN); cb.setChecked(RemapConfig.isMacroEn(this, slot));
                          cb.setOnCheckedChangeListener((x, chk) -> RemapConfig.setMacroEn(this, slot, chk));
                          c.addView(cb);
                          TextView info = new TextView(this);
                          int t1 = RemapConfig.getMacroT1(this, slot), t2 = RemapConfig.getMacroT2(this, slot);
                          int s1 = RemapConfig.getMacroS(this, slot, 0), s2 = RemapConfig.getMacroS(this, slot, 1), s3 = RemapConfig.getMacroS(this, slot, 2);
                          info.setText("التشغيل: " + RemapConfig.SHORT_LABELS[t1] + (t2 >= 0 ? " + " + RemapConfig.SHORT_LABELS[t2] : "") +
                              "\nينفذ معاً: " + (s1 >= 0 ? RemapConfig.SHORT_LABELS[s1] : "") + (s2 >= 0 ? " + " + RemapConfig.SHORT_LABELS[s2] : "") + (s3 >= 0 ? " + " + RemapConfig.SHORT_LABELS[s3] : ""));
                          info.setTextColor(Color.WHITE); c.addView(info);
                          Button ed = btn("تعديل أزرار المايكرو #" + slot, "#7C3AED");
                          ed.setOnClickListener(v -> editMacro(slot));
                          c.addView(ed); col.addView(c);
                      }
                  } else if (idx == 2) {
                      LinearLayout c = card("#1E293B");
                      TextView tv = new TextView(this);
                      tv.setText("إعداد لعبة Rocket League Sideswipe:\n• تم تفعيل الضغط المطول المستمر للتيربو (Boost) واللمس المتعدد للقفز مع التيربو في نفس اللحظة.\n• اضغط الزر بالأسفل لترتيب الدوائر تلقائياً ثم شغّل الرادار العائم:");
                      tv.setTextColor(Color.WHITE); tv.setTextSize(13f); c.addView(tv);
                      Button rl = btn("ضبط أزرار Rocket League Sideswipe الآن", "#059669");
                      rl.setOnClickListener(v -> {
                          DisplayMetrics dm = getResources().getDisplayMetrics();
                          RemapConfig.setHold(this, true); RemapConfig.setHudCount(this, 6);
                          RemapConfig.applySideswipe(this, dm.widthPixels, dm.heightPixels);
                          RemapConfig.saveMacro(this, 1, RemapConfig.BTN_L1, -1, RemapConfig.BTN_CROSS, RemapConfig.BTN_CIRCLE, -1, 0);
                          if (ControllerAccessibilityService.instance != null) ControllerAccessibilityService.instance.refreshHud();
                          Toast.makeText(this, "تم ضبط أزرار روكت ليغ + مايكرو L1 (قفز وتيربو معاً)!", Toast.LENGTH_LONG).show();
                      });
                      c.addView(rl); col.addView(c);
                  } else {
                      LinearLayout c = card("#1E293B");
                      testTv = new TextView(this);
                      testTv.setText("اضغط أي زر في يد PS5 الآن للتأكد من اسمه الحقيقي...");
                      testTv.setTextColor(Color.WHITE); testTv.setTextSize(15f);
                      c.addView(testTv); col.addView(c);
                  }
                  sv.addView(col); box.addView(sv);
              }

              private void editMacro(int slot) {
                  LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(24, 16, 24, 16);
                  Spinner t1 = spin(RemapConfig.getMacroT1(this, slot), false);
                  Spinner t2 = spin(RemapConfig.getMacroT2(this, slot), true);
                  Spinner s1 = spin(RemapConfig.getMacroS(this, slot, 0), false);
                  Spinner s2 = spin(RemapConfig.getMacroS(this, slot, 1), false);
                  Spinner s3 = spin(RemapConfig.getMacroS(this, slot, 2), true);
                  l.addView(lbl("زر التشغيل 1:")); l.addView(t1);
                  l.addView(lbl("زر تشغيل 2 للدمج (اختياري):")); l.addView(t2);
                  l.addView(lbl("الزر المدمج 1:")); l.addView(s1);
                  l.addView(lbl("الزر المدمج 2:")); l.addView(s2);
                  l.addView(lbl("الزر المدمج 3 (اختياري):")); l.addView(s3);
                  new AlertDialog.Builder(this).setTitle("ضبط المايكرو #" + slot).setView(l)
                      .setPositiveButton("حفظ", (d, w) -> {
                          RemapConfig.saveMacro(this, slot, t1.getSelectedItemPosition(),
                              t2.getSelectedItemPosition() == 0 ? -1 : t2.getSelectedItemPosition() - 1,
                              s1.getSelectedItemPosition(), s2.getSelectedItemPosition(),
                              s3.getSelectedItemPosition() == 0 ? -1 : s3.getSelectedItemPosition() - 1, 0);
                          showTab(1);
                      }).setNegativeButton("إلغاء", null).show();
              }

              private TextView lbl(String s) { TextView t = new TextView(this); t.setText(s); return t; }
              private Spinner spin(int cur, boolean none) {
                  Spinner sp = new Spinner(this); List<String> list = new ArrayList<>();
                  if (none) list.add("-- بدون --");
                  Collections.addAll(list, RemapConfig.BUTTON_NAMES);
                  sp.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, list));
                  sp.setSelection(cur >= 0 ? (none ? cur + 1 : cur) : 0);
                  return sp;
              }

              @Override public boolean onKeyDown(int code, KeyEvent ev) {
                  if (code == KeyEvent.KEYCODE_BACK || code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_DOWN) return super.onKeyDown(code, ev);
                  int id = RemapConfig.findIdByCode(this, code);
                  handleKey(code, id, id >= 0 ? RemapConfig.getMappedId(this, id) : -1);
                  return true;
              }
              @Override protected void onDestroy() { super.onDestroy(); ControllerAccessibilityService.calibrating = false; try { unregisterReceiver(rx); } catch (Exception ignored) {} }
          }
