name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Pro USB Recovery Studio and Build APK
        run: |
          rm -rf app build.gradle* settings.gradle* gradle.properties
          mkdir -p app/src/main/java/com/example/usbfixer app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UsbFixer"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.usbfixer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.usbfixer"
                  minSdk 21
                  targetSdk 33
                  versionCode 2
                  versionName "2.0-Pro"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_filter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="8" subclass="6" protocol="80" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application
                  android:label="استوديو إنقاذ الفلاشة Pro"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/usbfixer/MainActivity.java
          package com.example.usbfixer;

          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.usb.*;
          import android.media.MediaMetadataRetriever;
          import android.net.Uri;
          import android.os.*;
          import android.util.LruCache;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.nio.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private static final String ACTION_USB = "com.example.usbfixer.USB_PERMISSION";

              private TextView statusText, pathText, sizeLabel;
              private GridView gridView;
              private ProgressBar bar;
              private SeekBar zoomBar;

              private UsbManager usbMgr;
              private UsbDevice curDev;
              private UsbDeviceConnection conn;
              private UsbInterface usbIf;
              private UsbEndpoint epIn, epOut;

              private int tag = 1, fsType = 0, spc = 8, pendingMode = 0;
              private long partLba = 0, fatLba = 0, dataLba = 0, rootClus = 2;
              private volatile boolean stopScan = false;

              private final List<Long> dirStack = new ArrayList<>();
              private final List<String> pathNames = new ArrayList<>();
              private List<Entry> currentList = new ArrayList<>();
              private List<Entry> displayedList = new ArrayList<>();
              private int currentFilter = 0;

              private MediaAdapter adapter;
              private LruCache<String, Bitmap> thumbCache;
              private final ExecutorService thumbPool = Executors.newFixedThreadPool(2);
              private int numCols = 2;
              private int thumbHeightPx = 380;

              static class Entry {
                  String name;
                  boolean isDir, noChain, isDeleted, isHidden;
                  long clus, size;
                  String detectedExt = "";

                  String getEffectiveName() {
                      if (!detectedExt.isEmpty() && !name.toLowerCase(Locale.ROOT).endsWith(detectedExt)) {
                          return name + detectedExt;
                      }
                      return name;
                  }

                  boolean isImage() {
                      String n = getEffectiveName().toLowerCase(Locale.ROOT);
                      return n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".png") || n.endsWith(".webp") || n.endsWith(".bmp") || n.endsWith(".gif");
                  }

                  boolean isVideo() {
                      String n = getEffectiveName().toLowerCase(Locale.ROOT);
                      return n.endsWith(".mp4") || n.endsWith(".mkv") || n.endsWith(".3gp") || n.endsWith(".avi") || n.endsWith(".mov");
                  }
              }

              private final BroadcastReceiver receiver = new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) {
                      if (ACTION_USB.equals(i.getAction())) {
                          if (i.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false) && curDev != null)
                              executeMode(curDev, pendingMode);
                          else statusText.setText("تم رفض صلاحية الوصول للفلاشة.");
                      }
                  }
              };

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  usbMgr = (UsbManager) getSystemService(Context.USB_SERVICE);

                  int maxMem = (int) (Runtime.getRuntime().maxMemory() / 1024);
                  thumbCache = new LruCache<String, Bitmap>(maxMem / 5) {
                      @Override protected int sizeOf(String k, Bitmap v) {
                          return v.getByteCount() / 1024;
                      }
                  };

                  if (Build.VERSION.SDK_INT >= 23 && Build.VERSION.SDK_INT <= 29) {
                      if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 101);
                      }
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#0F172A"));
                  root.setPadding(20, 24, 20, 16);

                  TextView title = new TextView(this);
                  title.setText("استوديو إنقاذ وإصلاح الفلاشات الاحترافي");
                  title.setTextSize(17f);
                  title.setTextColor(Color.parseColor("#38BDF8"));
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 14);
                  root.addView(title);

                  LinearLayout actionsRow1 = new LinearLayout(this);
                  actionsRow1.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnFix = makeActionButton("إصلاح الإقلاع وفتح", "#2563EB");
                  Button btnUnhide = makeActionButton("إظهار المخفي والفيروس", "#059669");
                  actionsRow1.addView(btnFix);
                  actionsRow1.addView(btnUnhide);
                  root.addView(actionsRow1);

                  LinearLayout actionsRow2 = new LinearLayout(this);
                  actionsRow2.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnDeleted = makeActionButton("استعادة المحذوف و CHK", "#D97706");
                  Button btnDeep = makeActionButton("فحص عميق للقطاعات", "#7C3AED");
                  actionsRow2.addView(btnDeleted);
                  actionsRow2.addView(btnDeep);
                  root.addView(actionsRow2);

                  LinearLayout navRow = new LinearLayout(this);
                  navRow.setOrientation(LinearLayout.HORIZONTAL);
                  navRow.setGravity(Gravity.CENTER_VERTICAL);
                  navRow.setPadding(0, 10, 0, 6);

                  Button btnUp = makeSmallBtn("رجوع", "#334155");
                  Button btnAll = makeSmallBtn("الكل", "#1E293B");
                  Button btnMedia = makeSmallBtn("صور وفيديو فقط", "#1E293B");
                  Button btnSaveAll = makeSmallBtn("حفظ الكل", "#0284C7");

                  navRow.addView(btnUp);
                  navRow.addView(btnAll);
                  navRow.addView(btnMedia);
                  navRow.addView(btnSaveAll);
                  root.addView(navRow);

                  LinearLayout zoomRow = new LinearLayout(this);
                  zoomRow.setOrientation(LinearLayout.HORIZONTAL);
                  zoomRow.setGravity(Gravity.CENTER_VERTICAL);
                  zoomRow.setPadding(8, 4, 8, 8);

                  sizeLabel = new TextView(this);
                  sizeLabel.setText("حجم المصغرات (2 أعمدة):");
                  sizeLabel.setTextColor(Color.parseColor("#CBD5E1"));
                  sizeLabel.setTextSize(12f);

                  zoomBar = new SeekBar(this);
                  zoomBar.setMax(3);
                  zoomBar.setProgress(2);
                  zoomBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar s, int p, boolean fromUser) {
                          numCols = 4 - p;
                          if (numCols < 1) numCols = 1;
                          int screenW = getResources().getDisplayMetrics().widthPixels - 60;
                          thumbHeightPx = (int) ((screenW / numCols) * 0.85f);
                          sizeLabel.setText("حجم المصغرات (" + numCols + " أعمدة):");
                          gridView.setNumColumns(numCols);
                          adapter.notifyDataSetChanged();
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  });

                  zoomRow.addView(sizeLabel);
                  zoomRow.addView(zoomBar, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  root.addView(zoomRow);

                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setIndeterminate(true);
                  bar.setVisibility(View.GONE);
                  root.addView(bar);

                  pathText = new TextView(this);
                  pathText.setText("المسار: /");
                  pathText.setTextColor(Color.parseColor("#94A3B8"));
                  pathText.setTextSize(12f);
                  pathText.setPadding(8, 2, 8, 2);
                  root.addView(pathText);

                  statusText = new TextView(this);
                  statusText.setText("قم بتوصيل الفلاشة عبر OTG ثم اختر إحدى خدمات الإصلاح أو الفحص العميق أعلاه.");
                  statusText.setTextSize(13f);
                  statusText.setTextColor(Color.parseColor("#E2E8F0"));
                  statusText.setPadding(8, 6, 8, 10);
                  root.addView(statusText);

                  gridView = new GridView(this);
                  gridView.setNumColumns(numCols);
                  gridView.setHorizontalSpacing(14);
                  gridView.setVerticalSpacing(14);
                  gridView.setStretchMode(GridView.STRETCH_COLUMN_WIDTH);
                  adapter = new MediaAdapter();
                  gridView.setAdapter(adapter);
                  root.addView(gridView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);

                  int screenW = getResources().getDisplayMetrics().widthPixels - 60;
                  thumbHeightPx = (int) ((screenW / numCols) * 0.85f);

                  IntentFilter f = new IntentFilter(ACTION_USB);
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receiver, f, Context.RECEIVER_EXPORTED);
                  else registerReceiver(receiver, f);

                  btnFix.setOnClickListener(v -> { stopScan = true; connectUsb(0); });
                  btnUnhide.setOnClickListener(v -> { stopScan = true; connectUsb(1); });
                  btnDeleted.setOnClickListener(v -> { stopScan = true; connectUsb(2); });
                  btnDeep.setOnClickListener(v -> { stopScan = true; connectUsb(3); });

                  btnUp.setOnClickListener(v -> {
                      stopScan = true;
                      if (dirStack.size() > 1) {
                          dirStack.remove(dirStack.size() - 1);
                          pathNames.remove(pathNames.size() - 1);
                          loadDir(dirStack.get(dirStack.size() - 1));
                      }
                  });

                  btnAll.setOnClickListener(v -> { currentFilter = 0; applyFilter(); });
                  btnMedia.setOnClickListener(v -> { currentFilter = 1; applyFilter(); });
                  btnSaveAll.setOnClickListener(v -> saveAllDisplayed());
              }

              private Button makeActionButton(String text, String bgHex) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(12f);
                  b.setAllCaps(false);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(bgHex));
                  gd.setCornerRadius(18f);
                  b.setBackground(gd);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  lp.setMargins(6, 6, 6, 6);
                  b.setLayoutParams(lp);
                  b.setPadding(10, 18, 10, 18);
                  return b;
              }

              private Button makeSmallBtn(String text, String bgHex) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(11f);
                  b.setAllCaps(false);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(bgHex));
                  gd.setCornerRadius(14f);
                  b.setBackground(gd);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(4, 2, 4, 2);
                  b.setLayoutParams(lp);
                  b.setPadding(18, 10, 18, 10);
                  return b;
              }

              private void connectUsb(int mode) {
                  pendingMode = mode;
                  HashMap<String, UsbDevice> map = usbMgr.getDeviceList();
                  if (map == null || map.isEmpty()) {
                      statusText.setText("لم يتم العثور على فلاشة متصلة! تأكد من وصلة OTG.");
                      return;
                  }
                  curDev = map.values().iterator().next();
                  if (!usbMgr.hasPermission(curDev)) {
                      Intent in = new Intent(ACTION_USB).setPackage(getPackageName());
                      int fl = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0;
                      usbMgr.requestPermission(curDev, PendingIntent.getBroadcast(this, 0, in, fl));
                  } else {
                      executeMode(curDev, pendingMode);
                  }
              }

              private void executeMode(UsbDevice dev, int mode) {
                  if (mode == 0) fixAndRead(dev);
                  else if (mode == 1) unhideAndCleanVirus(dev);
                  else if (mode == 2) scanDeletedAndChk(dev);
                  else if (mode == 3) deepCarveRawSectors(dev);
              }

              private void fixAndRead(UsbDevice dev) {
                  bar.setVisibility(View.VISIBLE);
                  statusText.setText("جاري فحص وإصلاح قطاع الإقلاع وجدول الملفات...");
                  new Thread(() -> {
                      try {
                          if (!openMassStorage(dev)) throw new Exception("تعذر فتح قناة USB مع الفلاشة.");
                          String msg = repairBoot();
                          if (fsType == 0) {
                              runOnUiThread(() -> { bar.setVisibility(View.GONE); statusText.setText(msg); });
                              return;
                          }
                          dirStack.clear(); pathNames.clear();
                          dirStack.add(rootClus); pathNames.add("الرئيسية");
                          List<Entry> list = readDir(rootClus, false, false);
                          runOnUiThread(() -> {
                              bar.setVisibility(View.GONE);
                              statusText.setText(msg + " (تم العثور على " + list.size() + " عنصر)");
                              updatePathLabel();
                              setEntries(list);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> { bar.setVisibility(View.GONE); statusText.setText("خطأ: " + e.getMessage()); });
                      }
                  }).start();
              }

              private void unhideAndCleanVirus(UsbDevice dev) {
                  bar.setVisibility(View.VISIBLE);
                  statusText.setText("جاري إزالة إخفاء النظام والفيروسات (+H +S) عن جميع المجلدات والملفات...");
                  new Thread(() -> {
                      try {
                          if (!openMassStorage(dev)) throw new Exception("تعذر الاتصال بالفلاشة.");
                          repairBoot();
                          if (fsType == 0) throw new Exception("نظام الملفات غير معروف، استخدم الفحص العميق.");

                          int fixedCount = unhideClusterChain(rootClus);
                          List<Entry> list = readDir(rootClus, false, false);
                          for (Entry e : list) {
                              if (e.isDir && e.clus >= 2) {
                                  fixedCount += unhideClusterChain(e.clus);
                              }
                          }
                          final int totalFixed = fixedCount;
                          final List<Entry> refreshed = readDir(rootClus, false, false);
                          runOnUiThread(() -> {
                              bar.setVisibility(View.GONE);
                              statusText.setText("تم تحرير وإظهار " + totalFixed + " ملف/مجلد مخفي على الفلاشة بنجاح!");
                              setEntries(refreshed);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> { bar.setVisibility(View.GONE); statusText.setText("خطأ: " + e.getMessage()); });
                      }
                  }).start();
              }

              private int unhideClusterChain(long startClus) throws Exception {
                  int fixed = 0;
                  long clus = startClus;
                  int cnt = 0;
                  while (clus >= 2 && clus < 0x0FFFFFF7L && cnt++ < 32) {
                      long lba = dataLba + (clus - 2) * spc;
                      byte[] d = readSec(lba, spc);
                      boolean modified = false;
                      if (fsType == 1) {
                          for (int i = 0; i < d.length; i += 32) {
                              int b0 = d[i] & 0xFF;
                              if (b0 == 0) break;
                              if (b0 == 0xE5) continue;
                              int attr = d[i + 11] & 0xFF;
                              if (attr == 0x0F || (attr & 0x08) != 0) continue;
                              if ((attr & 0x06) != 0) {
                                  d[i + 11] = (byte) (attr & ~0x06);
                                  modified = true;
                                  fixed++;
                              }
                              String sName = new String(d, i, 8, StandardCharsets.US_ASCII);
                              if (sName.trim().isEmpty() && (attr & 0x10) != 0) {
                                  byte[] newName = "RECOVERD".getBytes(StandardCharsets.US_ASCII);
                                  System.arraycopy(newName, 0, d, i, 8);
                                  modified = true;
                                  fixed++;
                              }
                          }
                      } else if (fsType == 2) {
                          for (int i = 0; i < d.length; i += 32) {
                              int t = d[i] & 0xFF;
                              if (t == 0) break;
                              if (t == 0x85) {
                                  int attr = u16(d, i + 4);
                                  if ((attr & 0x06) != 0) {
                                      int cleanAttr = attr & ~0x06;
                                      d[i + 4] = (byte) (cleanAttr & 0xFF);
                                      d[i + 5] = (byte) ((cleanAttr >> 8) & 0xFF);
                                      modified = true;
                                      fixed++;
                                  }
                              }
                          }
                      }
                      if (modified) {
                          for (int s = 0; s < spc; s++) {
                              byte[] sec = new byte[512];
                              System.arraycopy(d, s * 512, sec, 0, 512);
                              writeSec(lba + s, sec);
                          }
                      }
                      clus = nextClus(clus);
                  }
                  return fixed;
              }

              private void scanDeletedAndChk(UsbDevice dev) {
                  bar.setVisibility(View.VISIBLE);
                  statusText.setText("جاري البحث عن الملفات المحذوفة وفك ملفات FOUND.000 المخفية...");
                  new Thread(() -> {
                      try {
                          if (!openMassStorage(dev)) throw new Exception("تعذر الاتصال بالفلاشة.");
                          repairBoot();
                          if (fsType == 0) throw new Exception("نظام الملفات غير معروف، استخدم زر الفحص العميق.");

                          List<Entry> recovered = new ArrayList<>();
                          List<Entry> rootAll = readDir(rootClus, false, true);
                          for (Entry e : rootAll) {
                              if (e.isDeleted && !e.isDir && e.size > 0) {
                                  inspectMagicHeader(e);
                                  recovered.add(e);
                              } else if (e.isDir && e.clus >= 2) {
                                  String up = e.name.toUpperCase(Locale.ROOT);
                                  boolean isFoundDir = up.startsWith("FOUND.") || up.contains("TRASH") || up.contains("RECYCLE") || e.name.startsWith("مجلد_مخفي");
                                  List<Entry> sub = readDir(e.clus, false, true);
                                  for (Entry se : sub) {
                                      if (!se.isDir && se.size > 0 && (se.isDeleted || isFoundDir || se.name.toUpperCase(Locale.ROOT).endsWith(".CHK"))) {
                                          inspectMagicHeader(se);
                                          recovered.add(se);
                                      }
                                  }
                              }
                          }

                          runOnUiThread(() -> {
                              bar.setVisibility(View.GONE);
                              pathText.setText("المسار: المحذوفات وملفات النظام المستردة (CHK)");
                              statusText.setText("تم العثور على " + recovered.size() + " ملف محذوف أو مفقود قابل للاستعادة والمعاينة!");
                              setEntries(recovered);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> { bar.setVisibility(View.GONE); statusText.setText("خطأ: " + e.getMessage()); });
                      }
                  }).start();
              }

              private void deepCarveRawSectors(UsbDevice dev) {
                  bar.setVisibility(View.VISIBLE);
                  stopScan = false;
                  statusText.setText("جاري الفحص العميق للقطاعات الخام بحثاً عن الصور والفيديوهات المفقودة...");
                  new Thread(() -> {
                      try {
                          if (!openMassStorage(dev)) throw new Exception("تعذر الاتصال بالفلاشة.");
                          repairBoot();
                          if (dataLba <= 0) dataLba = 2048;
                          if (spc <= 0) spc = 8;

                          final List<Entry> carved = new ArrayList<>();
                          int maxClustersToScan = 15000;

                          for (int c = 2; c < maxClustersToScan && !stopScan; c++) {
                              long lba = dataLba + (long) (c - 2) * spc;
                              byte[] hdr = readSec(lba, 1);
                              String ext = detectSignature(hdr);
                              if (!ext.isEmpty()) {
                                  Entry e = new Entry();
                                  e.clus = c;
                                  e.noChain = true;
                                  e.isDeleted = true;
                                  e.detectedExt = ext;
                                  e.name = "مستخرج_عميق_" + c + ext;
                                  if (ext.equals(".jpg")) e.size = 3 * 1024 * 1024L;
                                  else if (ext.equals(".png")) e.size = 2 * 1024 * 1024L;
                                  else if (ext.equals(".mp4")) e.size = 15 * 1024 * 1024L;
                                  else e.size = 2 * 1024 * 1024L;

                                  carved.add(e);
                                  final int foundSoFar = carved.size();
                                  final int curC = c;
                                  runOnUiThread(() -> {
                                      statusText.setText("فحص عميق للكلاستر " + curC + " ... تم اكتشاف " + foundSoFar + " ملفات حتى الآن");
                                      setEntries(new ArrayList<>(carved));
                                  });
                              } else if (c % 300 == 0) {
                                  final int curC = c;
                                  final int foundSoFar = carved.size();
                                  runOnUiThread(() -> statusText.setText("جاري فحص الكلاستر الخام " + curC + " / " + maxClustersToScan + " (المكتشف: " + foundSoFar + ")"));
                              }
                          }

                          runOnUiThread(() -> {
                              bar.setVisibility(View.GONE);
                              pathText.setText("المسار: نتائج الفحص العميق للقطاعات الخام");
                              statusText.setText("اكتمل الفحص العميق! تم استخراج " + carved.size() + " ملف من القطاعات الخام.");
                              setEntries(carved);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> { bar.setVisibility(View.GONE); statusText.setText("توقف الفحص العميق: " + e.getMessage()); });
                      }
                  }).start();
              }

              private void inspectMagicHeader(Entry e) {
                  if (e.clus < 2) return;
                  try {
                      long lba = dataLba + (e.clus - 2) * spc;
                      byte[] hdr = readSec(lba, 1);
                      String ext = detectSignature(hdr);
                      if (!ext.isEmpty()) e.detectedExt = ext;
                  } catch (Exception ignored) {}
              }

              private String detectSignature(byte[] b) {
                  if (b == null || b.length < 16) return "";
                  int b0 = b[0] & 0xFF, b1 = b[1] & 0xFF, b2 = b[2] & 0xFF, b3 = b[3] & 0xFF;
                  if (b0 == 0xFF && b1 == 0xD8 && b2 == 0xFF) return ".jpg";
                  if (b0 == 0x89 && b1 == 0x50 && b2 == 0x4E && b3 == 0x47) return ".png";
                  if (b0 == 0x47 && b1 == 0x49 && b2 == 0x46 && b3 == 0x38) return ".gif";
                  if ((b[4] & 0xFF) == 'f' && (b[5] & 0xFF) == 't' && (b[6] & 0xFF) == 'y' && (b[7] & 0xFF) == 'p') return ".mp4";
                  if (b0 == 0x25 && b1 == 0x50 && b2 == 0x44 && b3 == 0x46) return ".pdf";
                  if (b0 == 0x50 && b1 == 0x4B && b2 == 0x03 && b3 == 0x04) return ".zip";
                  if ((b0 == 0x49 && b1 == 0x44 && b2 == 0x33) || (b0 == 0xFF && (b1 & 0xE0) == 0xE0)) return ".mp3";
                  return "";
              }

              private void loadDir(long clus) {
                  bar.setVisibility(View.VISIBLE);
                  updatePathLabel();
                  new Thread(() -> {
                      try {
                          List<Entry> list = readDir(clus, false, false);
                          for (Entry e : list) {
                              if (!e.isDir && e.name.toUpperCase(Locale.ROOT).endsWith(".CHK")) {
                                  inspectMagicHeader(e);
                              }
                          }
                          runOnUiThread(() -> {
                              bar.setVisibility(View.GONE);
                              setEntries(list);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> bar.setVisibility(View.GONE));
                      }
                  }).start();
              }

              private void updatePathLabel() {
                  StringBuilder sb = new StringBuilder("المسار: ");
                  for (String p : pathNames) sb.append(p).append(" / ");
                  pathText.setText(sb.toString());
              }

              private void setEntries(List<Entry> list) {
                  currentList = list;
                  applyFilter();
              }

              private void applyFilter() {
                  displayedList = new ArrayList<>();
                  for (Entry e : currentList) {
                      if (currentFilter == 0) displayedList.add(e);
                      else if (currentFilter == 1 && (e.isDir || e.isImage() || e.isVideo())) displayedList.add(e);
                  }
                  adapter.notifyDataSetChanged();
              }

              class MediaAdapter extends BaseAdapter {
                  @Override public int getCount() { return displayedList.size(); }
                  @Override public Object getItem(int pos) { return displayedList.get(pos); }
                  @Override public long getItemId(int pos) { return pos; }

                  @Override public View getView(int pos, View convertView, ViewGroup parent) {
                      final Entry e = displayedList.get(pos);

                      LinearLayout card = new LinearLayout(MainActivity.this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(10, 10, 10, 12);
                      GradientDrawable gd = new GradientDrawable();
                      gd.setColor(Color.parseColor("#1E293B"));
                      gd.setCornerRadius(20f);
                      gd.setStroke(2, e.isDeleted ? Color.parseColor("#F59E0B") : Color.parseColor("#334155"));
                      card.setBackground(gd);

                      final ImageView img = new ImageView(MainActivity.this);
                      img.setLayoutParams(new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, thumbHeightPx));
                      img.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      img.setBackgroundColor(Color.parseColor("#0F172A"));

                      String cacheKey = e.clus + "_" + e.getEffectiveName();
                      img.setTag(cacheKey);

                      if (e.isDir) {
                          img.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                          img.setImageBitmap(drawBadgeBitmap("مجلد", "#2563EB", e.name));
                      } else if (e.isImage() || e.isVideo()) {
                          Bitmap cached = thumbCache.get(cacheKey);
                          if (cached != null) {
                              img.setImageBitmap(cached);
                          } else {
                              img.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                              img.setImageBitmap(drawBadgeBitmap(e.isVideo() ? "فيديو" : "صورة", "#334155", "جاري التحميل..."));
                              loadThumbnailAsync(e, cacheKey, img);
                          }
                      } else {
                          img.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                          img.setImageBitmap(drawBadgeBitmap("ملف", "#475569", e.detectedExt.isEmpty() ? "عام" : e.detectedExt));
                      }

                      TextView nameTv = new TextView(MainActivity.this);
                      String badge = e.isDeleted ? "[مسترد] " : (e.isHidden ? "[مخفي] " : "");
                      nameTv.setText(badge + e.getEffectiveName());
                      nameTv.setTextColor(Color.WHITE);
                      nameTv.setTextSize(12f);
                      nameTv.setSingleLine(true);
                      nameTv.setPadding(6, 8, 6, 2);

                      TextView infoTv = new TextView(MainActivity.this);
                      String sz = e.isDir ? "اضغط للفتح" : ((e.size / 1024) + " KB • معاينة/حفظ");
                      infoTv.setText(sz);
                      infoTv.setTextColor(Color.parseColor("#94A3B8"));
                      infoTv.setTextSize(11f);
                      infoTv.setPadding(6, 0, 6, 4);

                      card.addView(img);
                      card.addView(nameTv);
                      card.addView(infoTv);

                      card.setOnClickListener(v -> {
                          if (e.isDir) {
                              dirStack.add(e.clus);
                              pathNames.add(e.name);
                              loadDir(e.clus);
                          } else if (e.isImage()) {
                              previewImageDialog(e);
                          } else if (e.isVideo()) {
                              playVideoDialog(e);
                          } else {
                              saveFile(e);
                          }
                      });

                      return card;
                  }
              }

              private Bitmap drawBadgeBitmap(String mainText, String bgHex, String sub) {
                  Bitmap bmp = Bitmap.createBitmap(240, 180, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(bmp);
                  c.drawColor(Color.parseColor(bgHex));
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  p.setColor(Color.WHITE);
                  p.setTextSize(34f);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setTextAlign(Paint.Align.CENTER);
                  c.drawText(mainText, 120, 85, p);
                  p.setTypeface(Typeface.DEFAULT);
                  p.setTextSize(20f);
                  if (sub.length() > 16) sub = sub.substring(0, 16);
                  c.drawText(sub, 120, 135, p);
                  return bmp;
              }

              private void loadThumbnailAsync(final Entry e, final String key, final ImageView targetIv) {
                  thumbPool.submit(() -> {
                      try {
                          if (e.clus < 2) return;
                          Bitmap bmp = null;
                          if (e.isImage()) {
                              int maxBytes = (int) Math.min(e.size > 0 ? e.size : 524288, 786432);
                              byte[] raw = readFileBytes(e, maxBytes);
                              BitmapFactory.Options opts = new BitmapFactory.Options();
                              opts.inJustDecodeBounds = true;
                              BitmapFactory.decodeByteArray(raw, 0, raw.length, opts);
                              int sample = 1;
                              while (opts.outWidth / sample > 360 || opts.outHeight / sample > 360) sample *= 2;
                              opts.inJustDecodeBounds = false;
                              opts.inSampleSize = sample;
                              bmp = BitmapFactory.decodeByteArray(raw, 0, raw.length, opts);
                          } else if (e.isVideo()) {
                              int maxBytes = (int) Math.min(e.size > 0 ? e.size : 1572864, 1572864);
                              byte[] raw = readFileBytes(e, maxBytes);
                              File tmp = new File(getCacheDir(), "thumb_" + e.clus + ".mp4");
                              try (FileOutputStream fos = new FileOutputStream(tmp)) { fos.write(raw); }
                              MediaMetadataRetriever mmr = new MediaMetadataRetriever();
                              try {
                                  mmr.setDataSource(tmp.getAbsolutePath());
                                  Bitmap frame = mmr.getFrameAtTime(0);
                                  if (frame != null) {
                                      bmp = Bitmap.createScaledBitmap(frame, 320, 240, true).copy(Bitmap.Config.ARGB_8888, true);
                                      Canvas cv = new Canvas(bmp);
                                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                                      p.setColor(Color.argb(160, 0, 0, 0));
                                      cv.drawCircle(160, 120, 42, p);
                                      p.setColor(Color.WHITE);
                                      p.setTextSize(36f);
                                      p.setTextAlign(Paint.Align.CENTER);
                                      cv.drawText("▶", 164, 133, p);
                                  }
                              } finally {
                                  try { mmr.release(); } catch (Exception ignored) {}
                                  tmp.delete();
                              }
                          }
                          if (bmp != null) {
                              thumbCache.put(key, bmp);
                              final Bitmap finalBmp = bmp;
                              runOnUiThread(() -> {
                                  if (key.equals(targetIv.getTag())) {
                                      targetIv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                                      targetIv.setImageBitmap(finalBmp);
                                  }
                              });
                          }
                      } catch (Exception ignored) {}
                  });
              }

              private byte[] readFileBytes(Entry e, int maxBytes) throws Exception {
                  ByteArrayOutputStream bos = new ByteArrayOutputStream();
                  long rem = maxBytes;
                  long c = e.clus;
                  while (rem > 0 && c >= 2 && c < 0x0FFFFFF7L) {
                      byte[] d = readSec(dataLba + (c - 2) * spc, spc);
                      int w = (int) Math.min(rem, d.length);
                      bos.write(d, 0, w);
                      rem -= w;
                      if (rem > 0) c = (e.noChain || e.isDeleted) ? c + 1 : nextClus(c);
                  }
                  return bos.toByteArray();
              }

