          package com.example.ps5pro.v3;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.view.KeyEvent;

          public class RemapConfig {
              private static final String PREFS = "ps5_pro_v3_fixed";

              public static final int BTN_CROSS = 0;
              public static final int BTN_CIRCLE = 1;
              public static final int BTN_SQUARE = 2;
              public static final int BTN_TRIANGLE = 3;
              public static final int BTN_L1 = 4;
              public static final int BTN_R1 = 5;
              public static final int BTN_L2 = 6;
              public static final int BTN_R2 = 7;
              public static final int BTN_L3 = 8;
              public static final int BTN_R3 = 9;
              public static final int BTN_UP = 10;
              public static final int BTN_DOWN = 11;
              public static final int BTN_LEFT = 12;
              public static final int BTN_RIGHT = 13;

              public static final int BUTTON_COUNT = 14;

              public static final int[] DEFAULT_PS5_CODES = {
                  KeyEvent.KEYCODE_BUTTON_B,      // 0: ✕ (إكس) = 97
                  KeyEvent.KEYCODE_BUTTON_C,      // 1: ◯ (دائرة) = 98
                  KeyEvent.KEYCODE_BUTTON_A,      // 2: □ (مربع) = 96
                  KeyEvent.KEYCODE_BUTTON_X,      // 3: △ (مثلث) = 99
                  KeyEvent.KEYCODE_BUTTON_Y,      // 4: L1 = 100
                  KeyEvent.KEYCODE_BUTTON_Z,      // 5: R1 = 101
                  KeyEvent.KEYCODE_BUTTON_L1,     // 6: L2 = 102
                  KeyEvent.KEYCODE_BUTTON_R1,     // 7: R2 = 103
                  KeyEvent.KEYCODE_BUTTON_SELECT, // 8: L3 = 109
                  KeyEvent.KEYCODE_BUTTON_START,  // 9: R3 = 108
                  KeyEvent.KEYCODE_DPAD_UP,       // 10: ↑
                  KeyEvent.KEYCODE_DPAD_DOWN,     // 11: ↓
                  KeyEvent.KEYCODE_DPAD_LEFT,     // 12: ←
                  KeyEvent.KEYCODE_DPAD_RIGHT     // 13: →
              };

              public static final String[] BUTTON_NAMES = {
                  "✕ (إكس - Cross)",
                  "◯ (دائرة - Circle)",
                  "□ (مربع - Square)",
                  "△ (مثلث - Triangle)",
                  "L1 (الكتف الأيسر)",
                  "R1 (الكتف الأيمن)",
                  "L2 (الزناد الأيسر)",
                  "R2 (الزناد الأيمن)",
                  "L3 (العصا اليسرى)",
                  "R3 (العصا اليمنى)",
                  "سهم لأعلى",
                  "سهم لأسفل",
                  "سهم لليسار",
                  "سهم لليمين"
              };

              public static final String[] IN_GAME_NAMES = {
                  "تسميه الألعاب داخلياً: Button B",
                  "تسميه الألعاب داخلياً: Button C (أو لا تتعرف عليه بدون الرادار)",
                  "تسميه الألعاب داخلياً: Button A",
                  "تسميه الألعاب داخلياً: Button X",
                  "تسميه الألعاب داخلياً: Button Y",
                  "تسميه الألعاب داخلياً: Button Z (أو لا تتعرف عليه بدون الرادار)",
                  "تسميه الألعاب داخلياً: Button L1",
                  "تسميه الألعاب داخلياً: Button R1",
                  "تسميه الألعاب داخلياً: Select / Back",
                  "تسميه الألعاب داخلياً: Start",
                  "D-Pad Up",
                  "D-Pad Down",
                  "D-Pad Left",
                  "D-Pad Right"
              };

              public static final String[] SHORT_LABELS = {
                  "✕", "◯", "□", "△", "L1", "R1", "L2", "R2", "L3", "R3", "↑", "↓", "←", "→"
              };

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static int getHwCode(Context c, int id) {
                  return p(c).getInt("hw_" + id, DEFAULT_PS5_CODES[id]);
              }

              public static void setHwCode(Context c, int id, int code) {
                  p(c).edit().putInt("hw_" + id, code).apply();
              }

              public static void resetHw(Context c) {
                  SharedPreferences.Editor e = p(c).edit();
                  for (int i = 0; i < BUTTON_COUNT; i++) e.putInt("hw_" + i, DEFAULT_PS5_CODES[i]);
                  e.apply();
              }

              public static int findIdByCode(Context c, int code) {
                  for (int i = 0; i < BUTTON_COUNT; i++) {
                      if (getHwCode(c, i) == code) return i;
                  }
                  if (code == KeyEvent.KEYCODE_BUTTON_THUMBL) return BTN_L3;
                  if (code == KeyEvent.KEYCODE_BUTTON_THUMBR) return BTN_R3;
                  return -1;
              }

              public static int getMappedId(Context c, int id) {
                  return p(c).getInt("map_" + id, id);
              }

              public static void setMappedId(Context c, int id, int target) {
                  p(c).edit().putInt("map_" + id, target).apply();
              }

              public static void resetMaps(Context c) {
                  SharedPreferences.Editor e = p(c).edit();
                  for (int i = 0; i < BUTTON_COUNT; i++) {
                      e.putInt("map_" + i, i);
                      e.putBoolean("tb_" + i, false);
                  }
                  e.apply();
              }

              public static boolean isTurbo(Context c, int id) {
                  return p(c).getBoolean("tb_" + id, false);
              }

              public static void setTurbo(Context c, int id, boolean en) {
                  p(c).edit().putBoolean("tb_" + id, en).apply();
              }

              public static boolean isHold(Context c) {
                  return p(c).getBoolean("hold", true);
              }

              public static void setHold(Context c, boolean en) {
                  p(c).edit().putBoolean("hold", en).apply();
              }

              public static int getHudCount(Context c) {
                  return p(c).getInt("hud_cnt", 4);
              }

              public static void setHudCount(Context c, int cnt) {
                  p(c).edit().putInt("hud_cnt", Math.max(1, Math.min(14, cnt))).apply();
              }

              public static float getX(Context c, int id, int w, int h) {
                  int mw = Math.max(w, h);
                  float def;
                  if (id == BTN_CROSS) def = mw * 0.76f;
                  else if (id == BTN_CIRCLE) def = mw * 0.86f;
                  else if (id == BTN_SQUARE) def = mw * 0.66f;
                  else if (id == BTN_TRIANGLE) def = mw * 0.76f;
                  else def = 150f + (id % 5) * 125f;
                  return p(c).getFloat("px_" + id, def);
              }

              public static float getY(Context c, int id, int w, int h) {
                  int mh = Math.min(w, h);
                  float def;
                  if (id == BTN_CROSS) def = mh * 0.70f;
                  else if (id == BTN_CIRCLE) def = mh * 0.48f;
                  else if (id == BTN_SQUARE) def = mh * 0.70f;
                  else if (id == BTN_TRIANGLE) def = mh * 0.35f;
                  else def = 160f + (id / 5) * 125f;
                  return p(c).getFloat("py_" + id, def);
              }

              public static void savePos(Context c, int id, float x, float y) {
                  p(c).edit().putFloat("px_" + id, x).putFloat("py_" + id, y).apply();
              }

              public static void applySideswipe(Context c, int w, int h) {
                  int mw = Math.max(w, h), mh = Math.min(w, h);
                  p(c).edit()
                      .putInt("hud_cnt", 4)
                      .putBoolean("hold", true)
                      .putFloat("px_0", mw * 0.76f).putFloat("py_0", mh * 0.70f)
                      .putFloat("px_1", mw * 0.86f).putFloat("py_1", mh * 0.48f)
                      .putFloat("px_2", mw * 0.66f).putFloat("py_2", mh * 0.70f)
                      .putFloat("px_3", mw * 0.76f).putFloat("py_3", mh * 0.35f)
                      .apply();
              }

              public static boolean isMacroEn(Context c, int s) {
                  return p(c).getBoolean("m_en_" + s, false);
              }

              public static void setMacroEn(Context c, int s, boolean en) {
                  p(c).edit().putBoolean("m_en_" + s, en).apply();
              }

              public static int getMacroT1(Context c, int s) {
                  return p(c).getInt("m_t1_" + s, s == 1 ? BTN_L1 : (s == 2 ? BTN_R1 : BTN_L3));
              }

              public static int getMacroT2(Context c, int s) {
                  return p(c).getInt("m_t2_" + s, -1);
              }

              public static int getMacroS(Context c, int s, int idx) {
                  return p(c).getInt("m_s_" + s + "_" + idx, idx == 0 ? BTN_CROSS : (idx == 1 ? BTN_CIRCLE : -1));
              }

              public static int getMacroDelay(Context c, int s) {
                  return p(c).getInt("m_del_" + s, 0);
              }

              public static void saveMacro(Context c, int s, int t1, int t2, int s1, int s2, int s3, int del) {
                  p(c).edit()
                      .putBoolean("m_en_" + s, true)
                      .putInt("m_t1_" + s, t1)
                      .putInt("m_t2_" + s, t2)
                      .putInt("m_s_" + s + "_0", s1)
                      .putInt("m_s_" + s + "_1", s2)
                      .putInt("m_s_" + s + "_2", s3)
                      .putInt("m_del_" + s, del)
                      .apply();
              }
          }
          ===FILE: app/src/main/java/com/example/ps5pro/v3/ControllerAccessibilityService.java===
          package com.example.ps5pro.v3;

          import android.accessibilityservice.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.os.*;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.*;
          import java.util.*;

          public class ControllerAccessibilityService extends AccessibilityService {
              public static ControllerAccessibilityService instance;
              public static final String ACTION_DEBUG = "com.example.ps5pro.v3.DBG_V3";
              public static volatile boolean calibrating = false;

              private WindowManager wm;
              private View barView;
              private final Map<Integer, View> views = new HashMap<>();
              private final Map<Integer, WindowManager.LayoutParams> params = new HashMap<>();
              private boolean showing = false, locked = false;

              private final Set<Integer> pressed = new HashSet<>();
              private final Set<Integer> holdTargets = new LinkedHashSet<>();
              private final long[] lastMs = new long[14];
              private final Map<Integer, Runnable> turbos = new HashMap<>();
              private final Handler h = new Handler(Looper.getMainLooper());

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  try {
                      android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_DISPLAY);
                  } catch (Exception ignored) {}
                  Toast.makeText(this, "تم تفعيل محرك أزرار PS5 المصحح v3.0!", Toast.LENGTH_SHORT).show();
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              @Override
              protected boolean onKeyEvent(KeyEvent ev) {
                  int code = ev.getKeyCode(), act = ev.getAction();
                  if (code == KeyEvent.KEYCODE_BACK || code == KeyEvent.KEYCODE_HOME ||
                      code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_DOWN ||
                      code == KeyEvent.KEYCODE_POWER) {
                      return false;
                  }

                  int id = RemapConfig.findIdByCode(this, code);
                  int mapId = id >= 0 ? RemapConfig.getMappedId(this, id) : -1;

                  Intent i = new Intent(ACTION_DEBUG).setPackage(getPackageName());
                  i.putExtra("raw", code).putExtra("id", id).putExtra("mapId", mapId).putExtra("act", act);
                  sendBroadcast(i);

                  if (calibrating) return true;

                  if (!showing || !locked) {
                      if (act == KeyEvent.ACTION_UP) {
                          pressed.clear();
                          holdTargets.clear();
                      }
                      
